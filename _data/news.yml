# HIGHLIGHTS (homepage). New papers do not need an entry here: give the paper a "date" in
# publications.yml and it appears automatically.
# Shows the eight newest entries from the last 6 months;
# older entries disappear by themselves, and the section is hidden when nothing is recent.
# date: year and month as "YYYY-MM" (in quotes). label: short tag (Paper, Talk, Award, ...);
# label_de: the same in German. text / text_de: one sentence.
# link: optional (a paper, a talk, or a page on this site, e.g. /research/#sigma-vae).
# important: true  -> shown as an important update (strongest highlight). Optional.
# venue: optional, where it was published or presented (shown in italics with an accent line, like papers).

- label: Thesis
  date: "2026-10"
  label_de: Abschlussarbeit
  text: >-
    Gokul Perumbayil Vijayakrishnan completes his master's thesis on self-supervised learning of EEG
    representations for mental health in our lab, in collaboration with Prof. Dr. Magda Gregorová
    (THWS Würzburg-Schweinfurt). Congratulations, Gokul, and thank you for your excellent work!
  text_de: >-
    Gokul Perumbayil Vijayakrishnan schließt seine Masterarbeit über selbstüberwachtes Lernen von
    EEG-Repräsentationen für die psychische Gesundheit in unserem Labor ab, in Kooperation mit
    Prof. Dr. Magda Gregorová (THWS Würzburg-Schweinfurt). Herzlichen Glückwunsch, Gokul, und danke für
    deine hervorragende Arbeit!
