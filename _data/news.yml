- label: Talk & preprint
  date: "2026-06"
  label_de: Vortrag & Preprint
  venue: OHBM 2026
  text: >-
    Nitin Sharma presents transferable conditional brain charts, which link brain structure to
    Alzheimer's disease progression, at OHBM 2026; the preprint is on arXiv.
  text_de: >-
    Nitin Sharma stellt auf der OHBM 2026 übertragbare konditionale Brain Charts vor, die
