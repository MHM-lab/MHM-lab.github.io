  label_hi: सम्मेलन
  text_hi: >-
    Thomas Wolfers 10 से 13 अक्टूबर तक 6,300 से अधिक सहकर्मियों के साथ ECNP कांग्रेस में शामिल हुए, और वे कांग्रेस की Scientific Program Committee में योगदान का अवसर मिलने के लिए आभारी हैं।
  label_es: Congreso
  text_es: >-
    Thomas Wolfers se reúne del 10 al 13 de octubre con más de 6300 colegas y agradece formar parte del Scientific Program Committee del congreso.
  label_fr: Congrès
  text_fr: >-
    Thomas Wolfers retrouve plus de 6 300 collègues du 10 au 13 octobre et est reconnaissant de siéger au Scientific Program Committee du congrès.
- label: Talk & preprint
  date: "2026-06"
  label_de: Vortrag & Preprint
  venue: OHBM 2026
  text: >-
    Nitin Sharma presents transferable conditional brain charts, which link brain structure to
    Alzheimer's disease progression. The preprint is on arXiv.
  text_de: >-
    Nitin Sharma stellt übertragbare konditionale Brain Charts vor, die
    Hirnstruktur mit dem Verlauf der Alzheimer-Krankheit verknüpfen. Das Preprint ist auf arXiv.
  link: https://arxiv.org/abs/2610.21660
  label_zh: 报告与预印本
  text_zh: Nitin Sharma 介绍了可迁移的条件脑图谱（brain charts），将脑结构与阿尔茨海默病的进展联系起来。预印本已发布在 arXiv 上。
  label_hi: व्याख्यान और प्रीप्रिंट
  text_hi: >-
    Nitin Sharma ने ट्रांसफ़रेबल कंडीशनल ब्रेन चार्ट प्रस्तुत किए, जो मस्तिष्क की संरचना को अल्ज़ाइमर रोग की प्रगति से जोड़ते हैं। प्रीप्रिंट arXiv पर उपलब्ध है।
  label_es: Charla y preprint
  text_es: >-
    Nitin Sharma presenta gráficas cerebrales condicionales transferibles (brain charts), que relacionan la estructura cerebral con la progresión de la enfermedad de Alzheimer. El preprint está disponible en arXiv.
  label_fr: Exposé et prépublication
  text_fr: >-
    Nitin Sharma présente des courbes de référence cérébrales (brain charts) conditionnelles et transférables, qui relient la structure cérébrale à l’évolution de la maladie d’Alzheimer. La prépublication est disponible sur arXiv.
