- label: Conference
  date: "2026-10"
  label_de: Konferenz
  venue: 39th ECNP Congress, Munich
  text: >-
    Thomas Wolfers joins more than 6,300 colleagues from 10 to 13 October and is grateful to serve on
    the congress's Scientific Program Committee.
  text_de: >-
    Thomas Wolfers ist vom 10. bis 13. Oktober mit mehr als 6.300 Kolleginnen und Kollegen dabei und
    dankbar, im Scientific Program Committee des Kongresses mitzuwirken.
  link: https://www.ecnp.eu/congress2026/
  label_zh: 会议
