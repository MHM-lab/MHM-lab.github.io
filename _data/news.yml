# HIGHLIGHTS (homepage). New papers do not need an entry here: give the paper a "date" in
# publications.yml and it appears automatically.
# Shows the eight newest entries from the last 6 months;
# older entries disappear by themselves, and the section is hidden when nothing is recent.
# date: year and month as "YYYY-MM" (in quotes). label: short tag (Paper, Talk, Award, ...);
# label_de: the same in German. text / text_de: one sentence.
# link: optional (a paper, a talk, or a page on this site, e.g. /research/#sigma-vae).

