# HIGHLIGHTS (homepage). New papers do not need an entry here: give the paper a "date" in
# publications.yml and it appears automatically.
# Shows the eight newest entries from the last 6 months;
# older entries disappear by themselves, and the section is hidden when nothing is recent.
# date: year and month as "YYYY-MM" (in quotes). label: short tag (Paper, Talk, Award, ...);
# label_de: the same in German. text / text_de: one sentence.
# link: optional (a paper, a talk, or a page on this site, e.g. /research/#sigma-vae).
# important: true  -> shown as an important update (strongest highlight). Optional.
# venue: optional, where it was published or presented (shown in italics with an accent line, like papers).

- label: Thesis
  date: "2026-10"
  label_de: Abschlussarbeit
  text: >-
    Gokul Perumbayil Vijayakrishnan completes his master's thesis on self-supervised EEG learning in our
    lab, with Prof. Dr. Magda Gregorová (THWS). Well done, Gokul, and thank you.
  text_de: >-
    Gokul Perumbayil Vijayakrishnan schließt seine Masterarbeit zu selbstüberwachtem Lernen mit EEG in
    unserem Labor ab, gemeinsam mit Prof. Dr. Magda Gregorová (THWS). Gut gemacht, Gokul, und danke.
  label_zh: 毕业论文
  text_zh: >-
    Gokul Perumbayil Vijayakrishnan 在我们实验室完成了关于 EEG 自监督学习的硕士论文，合作导师为 Magda Gregorová 教授（THWS）。恭喜 Gokul，也谢谢你。
  label_hi: थीसिस
  text_hi: >-
    Gokul Perumbayil Vijayakrishnan ने हमारी प्रयोगशाला में प्रो. डॉ. Magda Gregorová (THWS) के साथ सेल्फ़-सुपरवाइज़्ड EEG लर्निंग पर अपनी मास्टर्स थीसिस पूरी की। बहुत बढ़िया, Gokul, और धन्यवाद।
  label_es: Tesis
  text_es: >-
    Gokul Perumbayil Vijayakrishnan completa en nuestro laboratorio su tesis de máster sobre aprendizaje autosupervisado con EEG, junto con la profesora Magda Gregorová (THWS). Buen trabajo, Gokul, y gracias.
  label_fr: Mémoire
  text_fr: >-
    Gokul Perumbayil Vijayakrishnan achève dans notre laboratoire son mémoire de master sur l’apprentissage auto-supervisé à partir de l’EEG, avec la professeure Magda Gregorová (THWS). Bravo, Gokul, et merci.
- label: Talk & paper
  date: "2026-10"
  label_de: Vortrag & Publikation
  venue: MICCAI 2026 (Main Track)
  text: >-
    Mariam Zabihi presents SIGMA-VAE, her multi-view autoencoder for normative modeling, with a talk and
    a paper.
  text_de: >-
    Mariam Zabihi stellt SIGMA-VAE, ihren Multi-View-Autoencoder für die normative Modellierung, mit einem
    Vortrag und einer Publikation vor.
  link: /research/#sigma-vae
  label_zh: 报告与论文
  text_zh: Mariam Zabihi 通过口头报告和论文介绍了 SIGMA-VAE，这是她为常模建模开发的多视图自编码器。
  label_hi: व्याख्यान और शोध-पत्र
  text_hi: >-
    Mariam Zabihi ने नॉर्मेटिव मॉडलिंग के लिए अपना मल्टी-व्यू ऑटोएनकोडर SIGMA-VAE एक व्याख्यान और एक शोध-पत्र के साथ प्रस्तुत किया।
  label_es: Charla y artículo
  text_es: >-
    Mariam Zabihi presenta SIGMA-VAE, su autocodificador multivista para el modelado normativo, con una charla y un artículo.
  label_fr: Exposé et article
  text_fr: >-
    Mariam Zabihi présente SIGMA-VAE, son autoencodeur multivue pour la modélisation normative, avec un exposé et un article.
