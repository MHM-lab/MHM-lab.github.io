# TEAM MEMBERS (shown on the People page, in this order)
# To add someone: copy one block, put their photo in /images/, and fill in the fields.
# first/last: the last name is shown in bold. Keep the list in alphabetical order by last name.
# To remove someone: delete their block (and add them to alumni.yml).
# Bio: one or two sentences on the person's research in the lab (plus degree/background). Markdown links work.

- first: Sicheng
  last: Dai
  role: PostDoc
  photo: dai.jpg
  bio: >-
    I model brain networks in health and disease by combining network science and machine learning. I
    hold a PhD in Computer Science from ENS Lyon.
- first: Alexander
  last: Frotscher
  role: PhD Candidate
  photo: alex.jpg
  bio: >-
    I develop unsupervised anomaly detection methods for neuroimaging, with a focus on methodological
    rigor in clinical applications. I hold a master's in Bioinformatics from the University of Tübingen.
- first: Mebin Muhammed
  last: Hamzakoya Sulaikha
  role: PhD Candidate
  photo: mebin.jpg
  bio: >-
    I develop longitudinal normative models for neuroimaging and other modalities, drawing on dynamic
    modeling. I hold an M.Tech from IIT Ropar.
- first: Atharva (Athu)
  last: Kand
  role: PhD Candidate
  photo: athu.jpg
  bio: >-
    I model how individual brain structure and function diverge over time, using stochastic, biologically
    informed models to capture uncertainty in psychiatric conditions. I hold a master's in Cognitive Neuroscience from the Donders Institute, Radboud University.
- first: Lina (Evangelia Sofia)
  last: Kornaraki
  role: MSc Student
  photo: lina.jpg
  bio: >-
    I am a master's student in Psychology at Friedrich Schiller University Jena, studying how structural and functional brain connectivity
    are coupled and whether this coupling can serve as a marker for psychiatric disorders.
- first: Marc
  last: Lemnitzer
  role: MSc Student & HiWi
  photo: marc.jpg
  bio: >-
    I am a master's student in Bioinformatics at the University of Tübingen and help develop and validate a machine learning package for
    mapping complex biomarker configurations.
- first: Francesco
  last: Mallus
  role: PhD Candidate
  photo: mallus.jpg
  bio: >-
    I study brain function across conscious and pathological states to identify reliable functional connectivity
    biomarkers. I hold a master's in Biomedical Engineering from the Polytechnic University of Turin.
- first: Minh-Hieu
  last: Nguyen
  role: PhD Candidate
  photo: mh_pic.jpg
  bio: >-
    I develop computational models of learning and decision-making in people with mental health conditions.
    I hold a master's in Neural Information Processing from the University of Tübingen.
- first: Gokul
  last: Perumbayil Vijayakrishnan
  role: MSc Student & HiWi
  photo: gokul.jpg
  bio: >-
    I am a master's student in Artificial Intelligence at the Technical University of Applied Sciences Würzburg-Schweinfurt, writing my thesis on self-supervised learning of
    EEG representations for mental health. I bring several years of industry experience in embedded systems
    and the automotive sector.
- first: Tanishka
  last: Randive
  role: BSc Student
  photo: tanishka.jpg
  bio: >-
    I am an undergraduate student in AI and Data Engineering at IIT Ropar, applying machine learning and computer vision
    to neuroimaging data.
- first: David
  last: Redmer
  role: MSc Student
  photo: david.jpg
  bio: >-
    I am a master's student in Psychology and Cognitive Neuroscience at Friedrich Schiller University Jena, interested in the mechanisms
    of neurodegenerative and psychiatric disorders and their translation into clinical practice.
- first: Elias
  last: Schreiner
  role: Data Scientist & IT Infrastructure
  photo: elias.jpg
  bio: >-
    I run the lab's IT infrastructure and apply deep learning to biological data on neurodegenerative
    conditions and comorbid mental disorders. I hold a master's in Bioinformatics from the University of Tübingen.
- first: Nitin
  last: Sharma
  role: PhD Candidate
  photo: nit_pic.jpg
  bio: >-
    I work with multimodal data in mental health, including domain adaptation for multi-site depression
    datasets, normative modeling, and mechanistic interpretability of large language models. I hold a master's in Neural Information Processing from the University of Tübingen.
- first: Madhumitha
  last: Sivakumar Punitha
  role: HiWi & Research Assistant
  photo: mad.jpg
  bio: >-
    I am a master's student in Photonics at Friedrich Schiller University Jena and support the lab's teaching and research activities.
- first: Thomas
  last: Wolfers
  role: Principal Investigator
  photo: thomas_pic.jpg
  bio: >-
    I lead the MHM Lab and develop machine learning approaches to identify individual-level factors in
    mental health and other complex conditions. I hold a PhD from Radboud University and held research
    positions in the Netherlands, Norway, and the UK.
- first: Jijia
  last: Xing
  role: PhD Candidate
  photo: jijia.jpg
  bio: >-
    I study how large language models encode clinical and psychological knowledge, and their longer-term
    risks, such as emotional dependence on sycophantic conversational AI. I hold a master's in Mathematics from Imperial College London.
- first: Yanwu
  last: Yang
  role: PostDoc & Humboldt Fellow
  photo: yanwu.jpg
  bio: >-
    I study brain development and aging at scale, using deep learning for clinical applications and examining
    the behavior of foundation models. I hold a PhD from Harbin Institute of Technology.
- first: Çağatay
  last: Yıldız
  role: PostDoc
  photo: cagatay.jpg
  bio: >-
    I study how large language models acquire new knowledge after pretraining without forgetting existing
    knowledge, combining continued pretraining with mechanistic interpretability. I hold a PhD from Aalto University and was previously a postdoc in Tübingen.
- first: Mariam
  last: Zabihi
  role: PostDoc & Boehringer Ingelheim Fellow
  photo: mariam.jpg
  bio: >-
    I develop generative normative models to address heterogeneity in psychiatric disorders. I hold a PhD in Statistical Neuroimaging from Radboud University Medical Center.
