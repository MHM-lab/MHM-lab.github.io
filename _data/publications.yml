# SELECTED PUBLICATIONS (newest first; grouped by year automatically)
# link_text: "Paper" for the published version, "Preprint" for arXiv/bioRxiv.
# summary_de: German summary for the German page (titles stay in English).
# first_author: surname of the first author (shown as "Surname et al., year").
# id: optional short name, so other pages can link to the paper (e.g. /research/#brain-dynamics).
# date: "YYYY-MM" when the paper was accepted or published. A paper with a date automatically appears
#   in the homepage Highlights for 6 months (no extra entry in news.yml needed).
# highlight / highlight_de: optional one-sentence text for that highlight (e.g. naming the first author);
#   the journal or conference is shown on the card anyway, so the sentence need not repeat it;
#   without a highlight sentence the card shows the paper title.

- year: 2026
  first_author: Yang
  title: A normative reference for large-scale human brain dynamics across the lifespan
  id: brain-dynamics
  date: "2026-08"
  highlight: >-
    Accepted: Yanwu Yang's normative reference for human brain dynamics across the lifespan.
  highlight_de: >-
    Angenommen: Yanwu Yangs normative Referenz für die Dynamik des menschlichen Gehirns über die Lebensspanne.
  venue: Nature Neuroscience (accepted)
  link: https://www.biorxiv.org/content/10.64898/2026.03.06.710057v1
  link_text: Preprint
  summary: >-
    We build a population-scale normative reference for intrinsic brain dynamics from resting-state fMRI
    of more than 10,000 people across the lifespan and 91 imaging sites. Recurring brain states anchor
    these dynamics to lifespan norms, revealing developmental and aging trends and heterogeneous
    alterations across mental health conditions, and enabling individual assessment of brain dynamics.
  summary_de: >-
    Wir erstellen eine populationsbasierte normative Referenz für die intrinsische Hirndynamik aus
    Ruhe-fMRT-Daten von mehr als 10.000 Menschen über die Lebensspanne und aus 91 Bildgebungsstandorten.
    Wiederkehrende Hirnzustände verankern diese Dynamik in Lebensspannennormen, zeigen Entwicklungs- und
    Alterungstrends sowie heterogene Veränderungen bei psychischen Erkrankungen und ermöglichen eine
    individuelle Beurteilung der Hirndynamik.
  summary_zh: >-
    我们利用全生命周期中来自91个成像站点、一万余人的静息态 fMRI 数据，构建了人群规模的内在脑动力学常模参照。反复出现的脑状态将这些动力学与全生命周期常模联系起来，揭示了发育和老化趋势以及不同心理健康问题中的异质性改变，并使对个体脑动力学的评估成为可能。
  highlight_zh: 已接收：Yanwu Yang 构建的全生命周期人类脑动力学常模参照。
  summary_hi: >-
    हम 91 इमेजिंग केंद्रों पर जीवनकाल के विभिन्न चरणों के 10,000 से अधिक लोगों के रेस्टिंग-स्टेट fMRI डेटा से मस्तिष्क की आंतरिक गतिशीलता के लिए जनसंख्या-स्तर का एक नॉर्मेटिव संदर्भ तैयार करते हैं। बार-बार उभरने वाली मस्तिष्क-अवस्थाएँ इस गतिशीलता को जीवनकाल के मानदंडों से जोड़ती हैं। इससे विकास और बढ़ती उम्र से जुड़े रुझान तथा मानसिक स्वास्थ्य संबंधी स्थितियों में विषम बदलाव सामने आते हैं, और मस्तिष्क की गतिशीलता का व्यक्तिगत आकलन संभव होता है।
  highlight_hi: >-
    स्वीकृत: जीवनकाल में मानव मस्तिष्क की गतिशीलता के लिए Yanwu Yang का नॉर्मेटिव संदर्भ।
  summary_es: >-
    Construimos una referencia normativa a escala poblacional de la dinámica cerebral intrínseca a partir de resonancias magnéticas funcionales en reposo de más de 10 000 personas de todas las edades, obtenidas en 91 centros. Los estados cerebrales recurrentes vinculan esta dinámica con normas a lo largo de la vida, lo que revela tendencias de desarrollo y envejecimiento y alteraciones heterogéneas en distintos problemas de salud mental, y permite evaluar la dinámica cerebral de cada persona.
  highlight_es: >-
    Aceptado: la referencia normativa de Yanwu Yang para la dinámica cerebral humana a lo largo de la vida.
  summary_fr: >-
    Nous construisons une référence normative à l’échelle de la population pour la dynamique cérébrale intrinsèque, à partir d’IRMf de repos de plus de 10 000 personnes de tous âges, issues de 91 sites d’imagerie. Des états cérébraux récurrents rattachent cette dynamique à des normes établies sur toute la durée de vie. Ils révèlent des tendances liées au développement et au vieillissement ainsi que des altérations hétérogènes selon les troubles de santé mentale, et permettent d’évaluer la dynamique cérébrale de chaque personne.
  highlight_fr: >-
    Accepté : la référence normative de Yanwu Yang pour la dynamique du cerveau humain tout au long de la vie.
- year: 2026
  first_author: Frotscher
  title: 'Deep Unsupervised Anomaly Detection in Brain Imaging: Large-Scale Benchmarking and Bias Analysis'
  id: anomaly-detection
  date: "2026-10"
  highlight: >-
    Accepted: Alexander Frotscher's large-scale benchmark of anomaly detection in brain imaging.
  highlight_de: >-
    Angenommen: Alexander Frotschers groß angelegter Benchmark zur Anomalieerkennung in der Bildgebung des Gehirns.
  venue: npj Digital Medicine (accepted)
  link: https://arxiv.org/abs/2512.01534
  link_text: Preprint
  summary: >-
    We build a large multi-center benchmark for deep unsupervised anomaly detection in brain imaging,
    trained on about 460,000 slices from healthy brains. Performance varies substantially across
    scanners, lesion types, and demographics, revealing systematic biases and methodological limits that
    future algorithms must overcome.
  summary_de: >-
    Wir erstellen einen großen multizentrischen Benchmark für unüberwachte Anomalieerkennung mit Deep
    Learning in der Bildgebung des Gehirns, trainiert auf rund 460.000 Schichtbildern gesunder Gehirne.
    Die Leistung schwankt erheblich zwischen Scannern, Läsionstypen und demografischen Gruppen und zeigt
    systematische Verzerrungen und methodische Grenzen, die künftige Algorithmen überwinden müssen.
  summary_zh: >-
    我们构建了一个大型多中心基准，用于评估脑成像中的深度无监督异常检测，训练数据为约46万张健康大脑切片。不同扫描仪、病灶类型和人口学特征之间的性能差异很大，揭示了未来算法必须克服的系统性偏差和方法学局限。
  highlight_zh: 已接收：Alexander Frotscher 关于脑成像异常检测的大规模基准研究。
  summary_hi: >-
    हम ब्रेन इमेजिंग में डीप अनसुपरवाइज़्ड एनॉमली डिटेक्शन के लिए एक बड़ा बहु-केंद्रीय बेंचमार्क बनाते हैं, जिसमें मॉडल स्वस्थ मस्तिष्कों की लगभग 4,60,000 स्लाइस पर प्रशिक्षित किए गए हैं। प्रदर्शन स्कैनर, घाव (लीज़न) के प्रकार और जनसांख्यिकी के अनुसार काफ़ी बदलता है। इससे व्यवस्थित पूर्वाग्रह और ऐसी पद्धतिगत सीमाएँ सामने आती हैं जिन्हें भविष्य के एल्गोरिदम को पार करना होगा।
  highlight_hi: >-
    स्वीकृत: ब्रेन इमेजिंग में एनॉमली डिटेक्शन पर Alexander Frotscher का बड़े पैमाने का बेंचमार्क।
  summary_es: >-
    Construimos un amplio banco de pruebas multicéntrico para la detección profunda no supervisada de anomalías en imagen cerebral, entrenado con unos 460 000 cortes de cerebros sanos. El rendimiento varía considerablemente según el escáner, el tipo de lesión y las características demográficas, lo que revela sesgos sistemáticos y límites metodológicos que los futuros algoritmos deberán superar.
  highlight_es: >-
    Aceptado: el banco de pruebas a gran escala de Alexander Frotscher para la detección de anomalías en imagen cerebral.
  summary_fr: >-
    Nous construisons un vaste banc d’essai multicentrique pour la détection profonde et non supervisée d’anomalies en imagerie cérébrale, entraîné sur environ 460 000 coupes de cerveaux sains. Les performances varient fortement selon les scanners, les types de lésions et les caractéristiques démographiques, ce qui révèle des biais systématiques et des limites méthodologiques que les futurs algorithmes devront surmonter.
  highlight_fr: >-
    Accepté : le banc d’essai à grande échelle d’Alexander Frotscher pour la détection d’anomalies en imagerie cérébrale.
- year: 2026
  first_author: Zabihi
  title: 'SIGMA-VAE: Sketched Isotropic Gaussian Multi-view Autoencoder for Normative Modeling'
  id: sigma-vae
  venue: MICCAI (Main Track)
  link: https://link.springer.com/chapter/10.1007/978-3-032-38239-9_51
  link_text: Paper
  summary: >-
    We introduce SIGMA-VAE, a multi-view autoencoder for normative modeling with a well-behaved latent
    geometry, sparse and interpretable representations, and uncertainty-weighted deviations. Trained on
    more than 40,000 brain scans from 328 scanners, it detects individual anomalies more sensitively,
    generalizes to unseen scanners, and discriminates Alzheimer's disease with an AUC of 0.91 on
    held-out and 0.87 on external data.
  summary_de: >-
    Wir stellen SIGMA-VAE vor, einen Multi-View-Autoencoder für die normative Modellierung mit gut
    strukturiertem latentem Raum, dünnbesetzten und interpretierbaren Repräsentationen und nach
    Unsicherheit gewichteten Abweichungen. Trainiert auf mehr als 40.000 Hirnscans von 328 Scannern,
    erkennt er individuelle Anomalien empfindlicher, generalisiert auf unbekannte Scanner und
    unterscheidet die Alzheimer-Krankheit mit einer AUC von 0,91 auf zurückgehaltenen und 0,87 auf
    externen Daten.
  summary_zh: >-
    我们提出 SIGMA-VAE，一种用于常模建模的多视图自编码器，具有良好的潜空间几何结构、稀疏且可解释的表征，以及按不确定性加权的偏离分数。该模型基于来自328台扫描仪的四万多份脑扫描数据训练，能够更灵敏地检测个体异常，可泛化到训练中未见过的扫描仪，在区分阿尔茨海默病时，在留出数据上的 AUC 为0.91，在外部数据上为0.87。
  summary_hi: >-
    हम SIGMA-VAE प्रस्तुत करते हैं, जो नॉर्मेटिव मॉडलिंग के लिए एक मल्टी-व्यू ऑटोएनकोडर है। इसकी लेटेंट ज्यामिति सुव्यवस्थित है, इसके रिप्रेज़ेंटेशन विरल (स्पार्स) और व्याख्येय हैं, और यह अनिश्चितता के अनुसार भारित विचलन देता है। 328 स्कैनरों से लिए गए 40,000 से अधिक ब्रेन स्कैन पर प्रशिक्षित यह मॉडल व्यक्तिगत असामान्यताओं को अधिक संवेदनशीलता से पहचानता है, पहले न देखे गए स्कैनरों के डेटा पर भी अच्छा काम करता है, और अल्ज़ाइमर रोग की पहचान में होल्ड-आउट डेटा पर 0.91 और बाहरी डेटा पर 0.87 का AUC प्राप्त करता है।
  summary_es: >-
    Presentamos SIGMA-VAE, un autocodificador multivista para el modelado normativo con una geometría latente regular, representaciones dispersas e interpretables y desviaciones ponderadas por la incertidumbre. Entrenado con más de 40 000 imágenes cerebrales de 328 escáneres, detecta anomalías individuales con mayor sensibilidad, generaliza a escáneres no vistos durante el entrenamiento y discrimina la enfermedad de Alzheimer con un AUC de 0,91 en datos reservados y de 0,87 en datos externos.
  summary_fr: >-
    Nous présentons SIGMA-VAE, un autoencodeur multivue pour la modélisation normative, doté d’une géométrie latente bien maîtrisée, de représentations parcimonieuses et interprétables, et d’écarts pondérés par l’incertitude. Entraîné sur plus de 40 000 examens cérébraux provenant de 328 scanners, il détecte les anomalies individuelles avec une plus grande sensibilité, se généralise à des scanners inconnus et distingue la maladie d’Alzheimer avec une AUC de 0,91 sur un jeu de test réservé et de 0,87 sur des données externes.
- year: 2026
  first_author: Yang
  title: 'MedSAMix: A Training-Free Model Merging Approach for Medical Image Segmentation'
  venue: AAAI (Main Track)
  link: https://ojs.aaai.org/index.php/AAAI/article/view/38161
  link_text: Paper
  summary: >-
    We present MedSAMix, a training-free method that automatically merges generalist (SAM) and
    specialist (MedSAM) segmentation models. Across 25 medical segmentation tasks, it reduces bias and
    improves both generalization and domain-specific accuracy by up to 6.7%.
  summary_de: >-
    Wir stellen MedSAMix vor, eine trainingsfreie Methode, die generalistische (SAM) und spezialisierte
    (MedSAM) Segmentierungsmodelle automatisch zusammenführt. Über 25 medizinische
    Segmentierungsaufgaben hinweg verringert sie Verzerrungen und verbessert Generalisierung und
    domänenspezifische Genauigkeit um bis zu 6,7 %.
  summary_zh: >-
    我们提出 MedSAMix，一种无需训练的方法，可自动融合通用型（SAM）和专用型（MedSAM）分割模型。在25项医学图像分割任务中，它降低了偏差，并将泛化能力和特定领域的准确率最多提升6.7%。
  summary_hi: >-
    हम MedSAMix प्रस्तुत करते हैं, जो सामान्य-उद्देश्य (SAM) और विशेषज्ञ (MedSAM) सेगमेंटेशन मॉडलों को बिना अतिरिक्त प्रशिक्षण के अपने-आप मिलाने की एक पद्धति है। 25 चिकित्सा सेगमेंटेशन कार्यों में यह पूर्वाग्रह को कम करती है और सामान्यीकरण तथा क्षेत्र-विशेष सटीकता, दोनों में 6.7% तक सुधार करती है।
  summary_es: >-
    Presentamos MedSAMix, un método sin entrenamiento que fusiona automáticamente modelos de segmentación generalistas (SAM) y especializados (MedSAM). En 25 tareas de segmentación médica, reduce el sesgo y mejora tanto la generalización como la precisión específica del dominio, hasta en un 6,7 %.
  summary_fr: >-
    Nous présentons MedSAMix, une méthode sans entraînement qui fusionne automatiquement des modèles de segmentation généralistes (SAM) et spécialisés (MedSAM). Sur 25 tâches de segmentation médicale, elle réduit les biais et améliore à la fois la généralisation et la précision propre à chaque domaine, jusqu’à 6,7 %.
- year: 2026
  first_author: Mallus
  title: 'From early to contemporary normative modeling: Mapping individual differences in neurophysiological
    signals'
  venue: Imaging Neuroscience
  link: https://doi.org/10.1162/IMAG.a.1269
  link_text: Paper
  summary: >-
    We review the resurgence of normative modeling in brain electrophysiology, driven by machine
    learning and large datasets, as the field moves from small age-based models to harmonized, more
    complex approaches. We argue that international collaboration, standardized pipelines, and new
    features are needed to move from proof of concept to individualized clinical applications.
  summary_de: >-
    Wir geben einen Überblick über die Renaissance der normativen Modellierung in der Elektrophysiologie
    des Gehirns, angetrieben durch maschinelles Lernen und große Datensätze, während sich das Feld von
    kleinen, altersbasierten Modellen zu harmonisierten, komplexeren Ansätzen entwickelt. Wir
    argumentieren, dass internationale Zusammenarbeit, standardisierte Pipelines und neue Merkmale nötig
    sind, um vom Proof of Concept zu individuellen klinischen Anwendungen zu gelangen.
  summary_zh: >-
    我们综述了在机器学习和大型数据集推动下，常模建模在脑电生理学领域的复兴：该领域正从基于年龄的小型模型走向经过数据协调、更加复杂的方法。我们认为，要从概念验证走向个体化的临床应用，需要国际合作、标准化的分析流程和新的特征。
  summary_hi: >-
    मशीन लर्निंग और बड़े डेटासेट के कारण ब्रेन इलेक्ट्रोफ़िज़ियोलॉजी में नॉर्मेटिव मॉडलिंग फिर से उभर रही है, और यह क्षेत्र आयु पर आधारित छोटे मॉडलों से हार्मोनाइज़्ड और अधिक जटिल दृष्टिकोणों की ओर बढ़ रहा है। हम इस विकास की समीक्षा करते हैं। हमारा तर्क है कि प्रूफ़ ऑफ़ कॉन्सेप्ट से आगे बढ़कर व्यक्तिगत नैदानिक अनुप्रयोगों तक पहुँचने के लिए अंतरराष्ट्रीय सहयोग, मानकीकृत पाइपलाइन और नए फ़ीचर की ज़रूरत है।
  summary_es: >-
    Revisamos el resurgimiento del modelado normativo en la electrofisiología cerebral, impulsado por el aprendizaje automático y los grandes conjuntos de datos, a medida que el campo pasa de modelos pequeños basados en la edad a enfoques armonizados y más complejos. Sostenemos que hacen falta colaboración internacional, flujos de procesamiento estandarizados y nuevas características para pasar de la prueba de concepto a aplicaciones clínicas individualizadas.
  summary_fr: >-
    Nous passons en revue le renouveau de la modélisation normative en électrophysiologie cérébrale, porté par l’apprentissage automatique et les grands jeux de données, alors que le domaine passe de petits modèles fondés sur l’âge à des approches harmonisées et plus complexes. Nous soutenons que la collaboration internationale, des chaînes de traitement standardisées et de nouvelles caractéristiques sont nécessaires pour passer de la preuve de concept à des applications cliniques individualisées.
- year: 2025
  first_author: Yang
  title: Hierarchical Characterization of Brain Dynamics via State Space-based Vector Quantization
  venue: MICCAI (Main Track)
  link: https://papers.miccai.org/miccai-2025/0405-Paper0118.html
  link_text: Paper
  summary: >-
    We introduce HST, a hierarchical state-space tokenization network that breaks brain activity into
    stable "tokens" and tracks how the brain moves between them. In two independent datasets, it
    captures these dynamics more clearly than existing approaches.
  summary_de: >-
    Wir stellen HST vor, ein hierarchisches State-Space-Tokenisierungsnetzwerk, das Hirnaktivität in
    stabile "Tokens" zerlegt und verfolgt, wie das Gehirn zwischen ihnen wechselt. In zwei unabhängigen
    Datensätzen erfasst es diese Dynamik deutlicher als bestehende Ansätze.
  summary_zh: 我们提出 HST，一种层级式状态空间分词网络，它将脑活动分解为稳定的“词元”，并追踪大脑在这些词元之间的转换。在两个独立数据集中，它比现有方法更清晰地刻画了这些动态变化。
  summary_hi: >-
    हम HST प्रस्तुत करते हैं, जो एक हायरार्किकल स्टेट-स्पेस टोकनाइज़ेशन नेटवर्क है। यह मस्तिष्क की गतिविधि को स्थिर "टोकन" में बाँटता है और यह ट्रैक करता है कि मस्तिष्क उनके बीच कैसे आता-जाता है। दो स्वतंत्र डेटासेट में यह इस गतिशीलता को मौजूदा तरीक़ों की तुलना में अधिक स्पष्ट रूप से दर्शाता है।
  summary_es: >-
    Presentamos HST, una red jerárquica de tokenización en el espacio de estados que descompone la actividad cerebral en “tokens” estables y sigue cómo el cerebro pasa de uno a otro. En dos conjuntos de datos independientes, capta esta dinámica con mayor claridad que los enfoques existentes.
  summary_fr: >-
    Nous présentons HST, un réseau hiérarchique de tokenisation fondé sur des modèles espace-état, qui décompose l’activité cérébrale en « tokens » stables et suit la manière dont le cerveau passe de l’un à l’autre. Dans deux jeux de données indépendants, il rend compte de cette dynamique plus clairement que les approches existantes.
- year: 2025
  first_author: Berthet
  title: A 10-year longitudinal study of brain cortical thickness in people with first-episode psychosis
    using normative models
  venue: Schizophrenia Bulletin
  link: https://doi.org/10.1093/schbul/sbae107
  link_text: Paper
  summary: >-
    Using normative models, we show that in some people with first-episode psychosis, brain
    abnormalities show signs of normalization over ten years. We also show that modeling site-specific
    variability is essential in longitudinal studies, where changes in scanners and protocols can
    otherwise confound the results.
  summary_de: >-
    Mit normativen Modellen zeigen wir, dass Hirnauffälligkeiten bei manchen Menschen mit erster
    psychotischer Episode über zehn Jahre Anzeichen einer Normalisierung zeigen. Zudem zeigen wir, dass
    die Modellierung standortspezifischer Variabilität in Längsschnittstudien unverzichtbar ist, da
    Wechsel von Scannern und Protokollen die Ergebnisse sonst verzerren können.
  summary_zh: >-
    我们利用常模模型发现，在部分首发精神病患者中，脑异常在十年间出现了趋于正常化的迹象。我们还发现，在纵向研究中对站点特异性变异进行建模至关重要，否则扫描仪和采集方案的变化可能会干扰结果。
  summary_hi: >-
    नॉर्मेटिव मॉडल की मदद से हम दिखाते हैं कि पहली बार साइकोसिस से प्रभावित (फ़र्स्ट-एपिसोड साइकोसिस) कुछ लोगों में मस्तिष्क की असामान्यताएँ दस वर्षों में सामान्य होने के संकेत दिखाती हैं। हम यह भी दिखाते हैं कि अनुदैर्ध्य अध्ययनों में केंद्र-विशेष भिन्नता की मॉडलिंग ज़रूरी है, क्योंकि अन्यथा स्कैनरों और प्रोटोकॉल में बदलाव परिणामों को भ्रामक बना सकते हैं।
  summary_es: >-
    Mediante modelos normativos, observamos que en algunas personas con un primer episodio psicótico las alteraciones cerebrales presentan signos de normalización a lo largo de diez años. También mostramos que modelar la variabilidad propia de cada centro es esencial en los estudios longitudinales, donde los cambios de escáner y de protocolo podrían, de lo contrario, distorsionar los resultados.
  summary_fr: >-
    À l’aide de modèles normatifs, nous montrons que chez certaines personnes ayant connu un premier épisode psychotique, les anomalies cérébrales présentent des signes de normalisation sur dix ans. Nous montrons aussi qu’il est essentiel de modéliser la variabilité propre à chaque site dans les études longitudinales, où les changements de scanners et de protocoles peuvent sinon fausser les résultats.
- year: 2024
  first_author: Leonardsen
  title: Characterising personalized neuropathology in dementia and mild cognitive impairment with explainable
    artificial intelligence
  venue: npj Digital Medicine
  link: https://doi.org/10.1038/s41746-024-01123-7
  link_text: Paper
  summary: >-
    We trained a deep neural network to predict dementia and used explainable AI to characterize
    individual differences. It predicts whether a person will develop dementia up to seven years in
    advance with good reliability.
  summary_de: >-
    Wir haben ein tiefes neuronales Netz zur Vorhersage von Demenz trainiert und individuelle
    Unterschiede mit erklärbarer KI charakterisiert. Es sagt bis zu sieben Jahre im Voraus mit guter
    Zuverlässigkeit vorher, ob eine Person eine Demenz entwickelt.
  summary_zh: 我们训练了一个深度神经网络来预测痴呆，并利用可解释人工智能刻画个体差异。该模型能够提前多达七年，较为可靠地预测一个人是否会发展为痴呆。
  summary_hi: >-
    हमने डिमेंशिया का पूर्वानुमान लगाने के लिए एक डीप न्यूरल नेटवर्क को प्रशिक्षित किया और व्यक्तिगत अंतरों को समझने के लिए एक्सप्लेनेबल एआई का उपयोग किया। यह अच्छी विश्वसनीयता के साथ सात वर्ष पहले तक बता सकता है कि किसी व्यक्ति को डिमेंशिया होगा या नहीं।
  summary_es: >-
    Entrenamos una red neuronal profunda para predecir la demencia y utilizamos IA explicable para caracterizar las diferencias individuales. La red predice con buena fiabilidad si una persona desarrollará demencia hasta siete años antes.
  summary_fr: >-
    Nous avons entraîné un réseau de neurones profond à prédire la démence et utilisé l’IA explicable pour caractériser les différences individuelles. Le modèle prédit avec une bonne fiabilité, jusqu’à sept ans à l’avance, si une personne développera une démence.
- year: 2024
  first_author: Genin
  title: Computational psychiatry and the evolving concept of a mental disorder
  venue: Synthese
  link: https://doi.org/10.1007/s11229-024-04741-6
  link_text: Paper
  summary: >-
    Growing dissatisfaction with traditional concepts of mental disorder has prompted a search for a
    coherent framework for psychiatric research and treatment. We compare computational paradigms such
    as normative modeling, network theory, and learning-theoretic approaches, and examine their
    similarities, differences, and potential conceptual conflicts.
  summary_de: >-
    Wachsende Unzufriedenheit mit traditionellen Konzepten psychischer Störungen hat die Suche nach
    einem kohärenten Rahmen für psychiatrische Forschung und Behandlung angestoßen. Wir vergleichen
    computationale Paradigmen wie normative Modellierung, Netzwerktheorie und lerntheoretische Ansätze
    und untersuchen ihre Gemeinsamkeiten, Unterschiede und möglichen konzeptuellen Konflikte.
  summary_zh: >-
    人们对传统精神障碍概念的不满日益增加，促使学界寻求一个连贯的精神病学研究与治疗框架。我们比较了常模建模、网络理论和学习理论方法等计算范式，并考察它们之间的相似之处、差异和潜在的概念冲突。
  summary_hi: >-
    मानसिक विकार की पारंपरिक अवधारणाओं से बढ़ते असंतोष के कारण मनोरोग संबंधी शोध और उपचार के लिए एक सुसंगत ढाँचे की खोज शुरू हुई है। हम नॉर्मेटिव मॉडलिंग, नेटवर्क सिद्धांत और लर्निंग-थ्योरी पर आधारित दृष्टिकोणों जैसे कम्प्यूटेशनल प्रतिमानों की तुलना करते हैं, और उनकी समानताओं, अंतरों और संभावित वैचारिक टकरावों की पड़ताल करते हैं।
  summary_es: >-
    La creciente insatisfacción con los conceptos tradicionales de trastorno mental ha impulsado la búsqueda de un marco coherente para la investigación y el tratamiento psiquiátricos. Comparamos paradigmas computacionales como el modelado normativo, la teoría de redes y los enfoques basados en la teoría del aprendizaje, y examinamos sus similitudes, sus diferencias y sus posibles conflictos conceptuales.
  summary_fr: >-
    L’insatisfaction croissante à l’égard des conceptions traditionnelles du trouble mental a conduit à rechercher un cadre cohérent pour la recherche et le traitement en psychiatrie. Nous comparons des paradigmes computationnels tels que la modélisation normative, la théorie des réseaux et les approches issues des théories de l’apprentissage, et nous examinons leurs points communs, leurs différences et leurs éventuels conflits conceptuels.
- year: 2024
  first_author: Kim
  title: Mapping Cerebellar Anatomical Heterogeneity in Mental and Neurological Illnesses
  venue: Nature Mental Health
  link: https://doi.org/10.1038/s44220-024-00297-z
  link_text: Paper
  summary: >-
    We trained normative models on more than 50,000 people to chart the development of the cerebellum
    across the lifespan. These models reveal individual differences in people with mental and
    neurological illnesses.
  summary_de: >-
    Wir haben normative Modelle an mehr als 50.000 Menschen trainiert, um die Entwicklung des Kleinhirns
    über die Lebensspanne zu kartieren. Die Modelle zeigen individuelle Unterschiede bei Menschen mit
    psychischen und neurologischen Erkrankungen.
  summary_zh: 我们基于五万多人的数据训练常模模型，描绘了小脑在整个生命周期中的发育轨迹。这些模型揭示了精神与神经系统疾病患者之间的个体差异。
  summary_hi: >-
    हमने जीवनकाल में सेरिबैलम (अनुमस्तिष्क) के विकास का चार्ट बनाने के लिए 50,000 से अधिक लोगों के डेटा पर नॉर्मेटिव मॉडल प्रशिक्षित किए। ये मॉडल मानसिक और तंत्रिका संबंधी बीमारियों वाले लोगों में व्यक्तिगत अंतरों को सामने लाते हैं।
  summary_es: >-
    Entrenamos modelos normativos con datos de más de 50 000 personas para trazar el desarrollo del cerebelo a lo largo de la vida. Estos modelos revelan diferencias individuales en personas con enfermedades mentales y neurológicas.
  summary_fr: >-
    Nous avons entraîné des modèles normatifs sur plus de 50 000 personnes pour cartographier le développement du cervelet tout au long de la vie. Ces modèles révèlent des différences individuelles chez les personnes atteintes de maladies mentales et neurologiques.
