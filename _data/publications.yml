  summary_hi: >-
    हमने अपने पहले के इस निष्कर्ष की फिर से पुष्टि की कि स्किज़ोफ़्रेनिया और बाइपोलर डिसऑर्डर वाले लोग नॉर्मेटिव मस्तिष्क से विचलन के व्यक्तिगत प्रोफ़ाइल दिखाते हैं। तब से अन्य समूहों ने भी इसकी पुष्टि की है, और यह निष्कर्ष अन्य मानसिक और तंत्रिका संबंधी स्थितियों पर भी लागू होता है।
  summary_es: >-
    Replicamos nuestro hallazgo anterior de que las personas con esquizofrenia y trastorno bipolar presentan perfiles individuales de desviación respecto al cerebro normativo. Desde entonces, otros grupos lo han replicado, y el hallazgo se extiende a otros trastornos mentales y neurológicos.
  summary_fr: >-
    Nous avons reproduit notre résultat antérieur selon lequel les personnes atteintes de schizophrénie ou de trouble bipolaire présentent des profils individuels d’écart par rapport au cerveau normatif. D’autres groupes l’ont depuis confirmé, et ce résultat s’étend à d’autres troubles mentaux et neurologiques.
