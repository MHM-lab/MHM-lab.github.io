# SELECTED PUBLICATIONS (newest first; grouped by year automatically)
# link_text: "Paper" for the published version, "Preprint" for arXiv/bioRxiv.

- year: 2026
  title: A normative reference for large-scale human brain dynamics across the lifespan
  venue: Nature Neuroscience
  link: https://www.biorxiv.org/content/10.64898/2026.03.06.710057v1
  link_text: Preprint
  summary: >-
    We establish a population-scale normative reference framework for intrinsic human brain dynamics using
    resting-state fMRI data from more than 10,000 individuals across the lifespan and 91 imaging sites.
    By identifying a compact set of recurring brain states that capture large-scale network reconfigurations,
    we anchor brain dynamics to normative lifespan models. This framework reveals systematic developmental
    and aging-related changes and uncovers heterogeneous alterations across mental health conditions,
    extending normative brain mapping from static brain features to the temporal domain and enabling individualized
    assessment of brain dynamics.
- year: 2026
  title: 'Deep Unsupervised Anomaly Detection in Brain Imaging: Large-Scale Benchmarking and Bias Analysis'
  venue: npj Digital Medicine
  link: https://arxiv.org/abs/2512.01534
  link_text: Preprint
  summary: >-
    We created a large, multi-center benchmark for deep unsupervised anomaly detection in brain imaging
    based on state-of-the-art methods developed for brain science and industry, using about 460,000 slices
    from healthy brains for training. Our systematic evaluation across scanners, lesion types, and demographics
    reveals substantial performance variability and highlights key methodological limitations that future
    algorithms must overcome, in addition to systematic biases.
- year: 2026
  title: 'SIGMA-VAE: Sketched Isotropic Gaussian Multi-view Autoencoder for Normative Modeling'
  venue: MICCAI (Main Track)
  link: https://link.springer.com/chapter/10.1007/978-3-032-38239-9_51
  link_text: Paper
  summary: >-
    We introduce SIGMA-VAE, a multi-view autoencoder for normative modeling that gives the latent space
    a well-behaved geometry, learns sparse and interpretable representations, and weights deviations by
    their uncertainty. Trained on more than 40,000 brain scans from 328 scanners, it detects individual-level
    anomalies more sensitively, generalizes to unseen scanners, and discriminates Alzheimer's disease
    with an AUC of 0.91 on held-out and 0.87 on external data.
- year: 2026
  title: 'MedSAMix: A Training-Free Model Merging Approach for Medical Image Segmentation'
  venue: AAAI (Main Track)
  link: https://ojs.aaai.org/index.php/AAAI/article/view/38161
  link_text: Paper
  summary: >-
    Universal medical segmentation models promise broad utility but struggle with scarce, heterogeneous
    data. We present MedSAMix, a training-free method that automatically merges generalist (SAM) and specialist
    (MedSAM) models for optimal performance. Across 25 tasks, MedSAMix reduces bias and improves both
    generalization and domain-specific accuracy by up to 6.7%.
- year: 2026
  title: 'From early to contemporary normative modeling: Mapping individual differences in neurophysiological
    signals'
  venue: Imaging Neuroscience
  link: https://doi.org/10.1162/IMAG.a.1269
  link_text: Paper
  summary: >-
    Normative modeling has emerged as a transformative framework for detecting individual deviations from
    typical brain function. This review charts its contemporary resurgence in brain electrophysiology,
    driven by machine learning and large-scale datasets, as the field moves beyond small, age-based models
    toward harmonized and more complex approaches. We argue the next step depends on international collaboration,
    standardized pipelines, and novel features, positioning the field to advance from proof-of-concept
    toward precise, individualized brain mapping towards clinical applications.
- year: 2025
  title: Hierarchical Characterization of Brain Dynamics via State Space-based Vector Quantization
  venue: MICCAI (Main Track)
  link: https://papers.miccai.org/miccai-2025/0405-Paper0118.html
  link_text: Paper
  summary: >-
    We introduce a Hierarchical State-space Tokenization network (HST), which breaks brain activity into
    stable "tokens," like building blocks, and tracks how the brain moves between them. Tested on two
    independent datasets our method captures these dynamics more clearly than existing approaches and
    shows promise for understanding dynamic brain functions in health and disease.
- year: 2025
  title: A 10-year longitudinal study of brain cortical thickness in people with first-episode psychosis
    using normative models
  venue: Schizophrenia Bulletin
  link: https://doi.org/10.1093/schbul/sbae107
  link_text: Paper
  summary: >-
    We demonstrate that, in some cases, brain abnormalities associated with schizophrenia show signs of
    normalization over time. Additionally, we underscore the critical importance of modeling site-specific
    variability to ensure accurate inference. This is especially relevant in longitudinal neuroimaging
    studies, where changes in scanning protocols and equipment over time can introduce significant confounds
    if not properly accounted for.
- year: 2024
  title: Characterising personalized neuropathology in dementia and mild cognitive impairment with explainable
    artificial intelligence
  venue: npj Digital Medicine
  link: https://doi.org/10.1038/s41746-024-01123-7
  link_text: Paper
  summary: >-
    We trained a deep neural network to predict dementias. We use explainable machine learning to tease
    apart individual differences and make predictions (over time) on whether a specific individual develops
    dementia. We can do that up to 7 years early with good reliability.
- year: 2024
  title: Computational psychiatry and the evolving concept of a mental disorder
  venue: Synthese
  link: https://doi.org/10.1007/s11229-024-04741-6
  link_text: Paper
  summary: >-
    We explore the pursuit of a coherent framework for research and treatment in psychiatry, driven by
    growing dissatisfaction with traditional concepts of mental disorders. This exploration incorporates
    various computational paradigms, including normative modeling, network theory, and learning-theoretic
    approaches. Each of these paradigms offers unique methodologies and visions for reconceptualizing
    mental disorders. In this discussion, we examine their similarities, differences, and potential conceptual
    conflicts.
- year: 2024
  title: Mapping Cerebellar Anatomical Heterogeneity in Mental and Neurological Illnesses
  venue: Nature Mental Health
  link: https://doi.org/10.1038/s44220-024-00297-z
  link_text: Paper
  summary: >-
    We trained normative models on more than 50k individuals, charting the development of the cerebellum
    over the lifespan. We tease apart individual differences in patients with mental and neurological
    illness.
- year: 2023
  title: Regional, circuit and network heterogeneity of brain abnormalities in psychiatric disorders
  venue: Nature Neuroscience
  link: https://www.nature.com/articles/s41593-023-01404-6
  link_text: Paper
  summary: >-
    We developed normative models and applied them to analyze various mental disorders. Our study meticulously
    characterized the resulting deviations at the voxel, regional, and network levels of the human brain.
    Notably, our findings reveal a higher degree of overlap across individuals at the network level.
- year: 2022
  title: Deep neural networks learn general and clinically relevant representations of the ageing brain
  venue: NeuroImage
  link: https://doi.org/10.1016/j.neuroimage.2022.119210
  link_text: Paper
  summary: >-
    We trained a deep neural network on N > 50k individuals to predict the aging brain. We transferred
    this model to make clinical predictions. We show that scale matters also in deep machine learning
    based imaging. Our model has been benchmarked by another group to be the-state-of-the-art brain age
    model. It demonstrates increased robustness to domain shifts, albeit with the previously observed
    brain-age accuracy vs. disease detection trade-off.
- year: 2022
  title: Charting brain growth and aging at high spatial precision
  venue: eLife
  link: https://doi.org/10.7554/eLife.72904
  link_text: Paper
  summary: >-
    We charted normative models of the human brain at high spatial precision for a sample larger than
    50k individuals. This is a massive population scale neuroimaging based normative modeling approach
    that can be translated to new samples and is freely available online for other scientists to use.
- year: 2022
  title: The normative modeling framework for computational psychiatry
  venue: Nature Protocols
  link: https://doi.org/10.1038/s41596-022-00696-5
  link_text: Paper
  summary: >-
    We describe the normative modeling framework for computational psychiatry, providing a comprehensive
    exploration of its principles and significance within the discipline, while also offering accessible
    tools for analyzing data within this framework.
- year: 2021
  title: Replicating extensive brain structural heterogeneity in individuals with schizophrenia and bipolar
    disorder
  venue: Human Brain Mapping
  link: https://doi.org/10.1002/hbm.25386
  link_text: Paper
  summary: >-
    We replicated our earlier finding that patients with schizophrenia and bipolar disorder show an individualized
    profile of normative brain deviations. This has been replicated by various groups and extends to different
    mental and neurological conditions.
- year: 2019
  title: Inter-individual differences in human brain structure and morphometry link to population variation
    in demographics and behavior
  venue: eLife
  link: https://doi.org/10.7554/eLife.44443.001
  link_text: Paper
  summary: >-
    We could show that brain structure explains a large proportion of functional interactions between
