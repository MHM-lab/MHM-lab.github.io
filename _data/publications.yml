# SELECTED PUBLICATIONS (newest first; grouped by year automatically)
# link_text: "Paper" for the published version, "Preprint" for arXiv/bioRxiv.
# summary_de: German summary for the German page (titles stay in English).
# id: optional short name, so other pages can link to the paper (e.g. /research/#brain-dynamics).
# date: "YYYY-MM" when the paper was accepted or published. A paper with a date automatically appears
#   in the homepage Highlights for 6 months (no extra entry in news.yml needed).
# highlight / highlight_de: optional one-sentence text for that highlight (e.g. naming the first author);
#   the journal or conference is shown on the card anyway, so the sentence need not repeat it;
#   without a highlight sentence the card shows the paper title.

- year: 2026
  title: A normative reference for large-scale human brain dynamics across the lifespan
  id: brain-dynamics
  date: "2026-08"
  highlight: >-
    Accepted: Yanwu Yang's normative reference for human brain dynamics across the lifespan.
  highlight_de: >-
    Angenommen: Yanwu Yangs normative Referenz für die Dynamik des menschlichen Gehirns über die Lebensspanne.
  venue: Nature Neuroscience (accepted)
  link: https://www.biorxiv.org/content/10.64898/2026.03.06.710057v1
  link_text: Preprint
  summary: >-
    We build a population-scale normative reference for intrinsic brain dynamics from resting-state fMRI
    of more than 10,000 people across the lifespan and 91 imaging sites. Recurring brain states anchor
    these dynamics to lifespan norms, revealing developmental and aging trends and heterogeneous
    alterations across mental health conditions, and enabling individual assessment of brain dynamics.
  summary_de: >-
    Wir erstellen eine populationsbasierte normative Referenz für die intrinsische Hirndynamik aus
    Ruhe-fMRT-Daten von mehr als 10.000 Menschen über die Lebensspanne und aus 91 Bildgebungsstandorten.
    Wiederkehrende Hirnzustände verankern diese Dynamik in Lebensspannennormen, zeigen Entwicklungs- und
    Alterungstrends sowie heterogene Veränderungen bei psychischen Erkrankungen und ermöglichen eine
    individuelle Beurteilung der Hirndynamik.
- year: 2026
  title: 'Deep Unsupervised Anomaly Detection in Brain Imaging: Large-Scale Benchmarking and Bias Analysis'
  id: anomaly-detection
  date: "2026-10"
  highlight: >-
    Accepted: Alexander Frotscher's large-scale benchmark of anomaly detection in brain imaging.
  highlight_de: >-
    Angenommen: Alexander Frotschers groß angelegter Benchmark zur Anomalieerkennung in der Bildgebung des Gehirns.
  venue: npj Digital Medicine (accepted)
  link: https://arxiv.org/abs/2512.01534
  link_text: Preprint
  summary: >-
    We build a large multi-center benchmark for deep unsupervised anomaly detection in brain imaging,
    trained on about 460,000 slices from healthy brains. Performance varies substantially across
    scanners, lesion types, and demographics, revealing systematic biases and methodological limits that
    future algorithms must overcome.
  summary_de: >-
    Wir erstellen einen großen multizentrischen Benchmark für unüberwachte Anomalieerkennung mit Deep
    Learning in der Bildgebung des Gehirns, trainiert auf rund 460.000 Schichtbildern gesunder Gehirne.
    Die Leistung schwankt erheblich zwischen Scannern, Läsionstypen und demografischen Gruppen und zeigt
    systematische Verzerrungen und methodische Grenzen, die künftige Algorithmen überwinden müssen.
- year: 2026
  title: 'SIGMA-VAE: Sketched Isotropic Gaussian Multi-view Autoencoder for Normative Modeling'
  id: sigma-vae
  venue: MICCAI (Main Track)
  link: https://link.springer.com/chapter/10.1007/978-3-032-38239-9_51
  link_text: Paper
  summary: >-
    We introduce SIGMA-VAE, a multi-view autoencoder for normative modeling with a well-behaved latent
    geometry, sparse and interpretable representations, and uncertainty-weighted deviations. Trained on
    more than 40,000 brain scans from 328 scanners, it detects individual anomalies more sensitively,
    generalizes to unseen scanners, and discriminates Alzheimer's disease with an AUC of 0.91 on
    held-out and 0.87 on external data.
  summary_de: >-
    Wir stellen SIGMA-VAE vor, einen Multi-View-Autoencoder für die normative Modellierung mit gut
    strukturiertem latentem Raum, dünnbesetzten und interpretierbaren Repräsentationen und nach
    Unsicherheit gewichteten Abweichungen. Trainiert auf mehr als 40.000 Hirnscans von 328 Scannern,
    erkennt er individuelle Anomalien empfindlicher, generalisiert auf unbekannte Scanner und
    unterscheidet die Alzheimer-Krankheit mit einer AUC von 0,91 auf zurückgehaltenen und 0,87 auf
    externen Daten.
- year: 2026
  title: 'MedSAMix: A Training-Free Model Merging Approach for Medical Image Segmentation'
  venue: AAAI (Main Track)
  link: https://ojs.aaai.org/index.php/AAAI/article/view/38161
  link_text: Paper
  summary: >-
    We present MedSAMix, a training-free method that automatically merges generalist (SAM) and
    specialist (MedSAM) segmentation models. Across 25 medical segmentation tasks, it reduces bias and
    improves both generalization and domain-specific accuracy by up to 6.7%.
  summary_de: >-
    Wir stellen MedSAMix vor, eine trainingsfreie Methode, die generalistische (SAM) und spezialisierte
    (MedSAM) Segmentierungsmodelle automatisch zusammenführt. Über 25 medizinische
    Segmentierungsaufgaben hinweg verringert sie Verzerrungen und verbessert Generalisierung und
    domänenspezifische Genauigkeit um bis zu 6,7 %.
- year: 2026
  title: 'From early to contemporary normative modeling: Mapping individual differences in neurophysiological
    signals'
  venue: Imaging Neuroscience
  link: https://doi.org/10.1162/IMAG.a.1269
  link_text: Paper
  summary: >-
    We review the resurgence of normative modeling in brain electrophysiology, driven by machine
    learning and large datasets, as the field moves from small age-based models to harmonized, more
    complex approaches. We argue that international collaboration, standardized pipelines, and new
    features are needed to move from proof of concept to individualized clinical applications.
  summary_de: >-
    Wir geben einen Überblick über die Renaissance der normativen Modellierung in der Elektrophysiologie
    des Gehirns, angetrieben durch maschinelles Lernen und große Datensätze, während sich das Feld von
    kleinen, altersbasierten Modellen zu harmonisierten, komplexeren Ansätzen entwickelt. Wir
    argumentieren, dass internationale Zusammenarbeit, standardisierte Pipelines und neue Merkmale nötig
    sind, um vom Proof of Concept zu individuellen klinischen Anwendungen zu gelangen.
- year: 2025
  title: Hierarchical Characterization of Brain Dynamics via State Space-based Vector Quantization
  venue: MICCAI (Main Track)
  link: https://papers.miccai.org/miccai-2025/0405-Paper0118.html
  link_text: Paper
  summary: >-
    We introduce HST, a hierarchical state-space tokenization network that breaks brain activity into
    stable "tokens" and tracks how the brain moves between them. In two independent datasets, it
    captures these dynamics more clearly than existing approaches.
  summary_de: >-
    Wir stellen HST vor, ein hierarchisches State-Space-Tokenisierungsnetzwerk, das Hirnaktivität in
    stabile "Tokens" zerlegt und verfolgt, wie das Gehirn zwischen ihnen wechselt. In zwei unabhängigen
    Datensätzen erfasst es diese Dynamik deutlicher als bestehende Ansätze.
- year: 2025
  title: A 10-year longitudinal study of brain cortical thickness in people with first-episode psychosis
    using normative models
  venue: Schizophrenia Bulletin
  link: https://doi.org/10.1093/schbul/sbae107
  link_text: Paper
  summary: >-
    Using normative models, we show that in some people with first-episode psychosis, brain
    abnormalities show signs of normalization over ten years. We also show that modeling site-specific
    variability is essential in longitudinal studies, where changes in scanners and protocols can
    otherwise confound the results.
  summary_de: >-
    Mit normativen Modellen zeigen wir, dass Hirnauffälligkeiten bei manchen Menschen mit erster
    psychotischer Episode über zehn Jahre Anzeichen einer Normalisierung zeigen. Zudem zeigen wir, dass
    die Modellierung standortspezifischer Variabilität in Längsschnittstudien unverzichtbar ist, da
    Wechsel von Scannern und Protokollen die Ergebnisse sonst verzerren können.
- year: 2024
  title: Characterising personalized neuropathology in dementia and mild cognitive impairment with explainable
    artificial intelligence
  venue: npj Digital Medicine
  link: https://doi.org/10.1038/s41746-024-01123-7
  link_text: Paper
  summary: >-
    We trained a deep neural network to predict dementia and used explainable AI to characterize
    individual differences. It predicts whether a person will develop dementia up to seven years in
    advance with good reliability.
  summary_de: >-
    Wir haben ein tiefes neuronales Netz zur Vorhersage von Demenz trainiert und individuelle
    Unterschiede mit erklärbarer KI charakterisiert. Es sagt bis zu sieben Jahre im Voraus mit guter
    Zuverlässigkeit vorher, ob eine Person eine Demenz entwickelt.
- year: 2024
  title: Computational psychiatry and the evolving concept of a mental disorder
  venue: Synthese
  link: https://doi.org/10.1007/s11229-024-04741-6
  link_text: Paper
  summary: >-
    Growing dissatisfaction with traditional concepts of mental disorder has prompted a search for a
    coherent framework for psychiatric research and treatment. We compare computational paradigms such
    as normative modeling, network theory, and learning-theoretic approaches, and examine their
    similarities, differences, and potential conceptual conflicts.
  summary_de: >-
    Wachsende Unzufriedenheit mit traditionellen Konzepten psychischer Störungen hat die Suche nach
    einem kohärenten Rahmen für psychiatrische Forschung und Behandlung angestoßen. Wir vergleichen
    computationale Paradigmen wie normative Modellierung, Netzwerktheorie und lerntheoretische Ansätze
    und untersuchen ihre Gemeinsamkeiten, Unterschiede und möglichen konzeptuellen Konflikte.
- year: 2024
  title: Mapping Cerebellar Anatomical Heterogeneity in Mental and Neurological Illnesses
  venue: Nature Mental Health
  link: https://doi.org/10.1038/s44220-024-00297-z
  link_text: Paper
  summary: >-
    We trained normative models on more than 50,000 people to chart the development of the cerebellum
    across the lifespan. These models reveal individual differences in people with mental and
    neurological illnesses.
  summary_de: >-
    Wir haben normative Modelle an mehr als 50.000 Menschen trainiert, um die Entwicklung des Kleinhirns
    über die Lebensspanne zu kartieren. Die Modelle zeigen individuelle Unterschiede bei Menschen mit
    psychischen und neurologischen Erkrankungen.
- year: 2023
  title: Regional, circuit and network heterogeneity of brain abnormalities in psychiatric disorders
  venue: Nature Neuroscience
  link: https://www.nature.com/articles/s41593-023-01404-6
  link_text: Paper
  summary: >-
    We applied normative models across several mental disorders and characterized individual deviations
    at the voxel, regional, and network levels of the brain. Deviations overlap more across individuals
    at the network level.
  summary_de: >-
    Wir haben normative Modelle auf mehrere psychische Störungen angewendet und individuelle
    Abweichungen auf Voxel-, Regions- und Netzwerkebene des Gehirns charakterisiert. Auf Netzwerkebene
    überschneiden sich die Abweichungen zwischen Personen stärker.
- year: 2022
  title: Deep neural networks learn general and clinically relevant representations of the ageing brain
  venue: NeuroImage
  link: https://doi.org/10.1016/j.neuroimage.2022.119210
  link_text: Paper
  summary: >-
    We trained a deep neural network on more than 50,000 people to predict brain age and transferred it
    to clinical prediction tasks, showing that scale matters for deep learning in neuroimaging.
    Independently benchmarked as a state-of-the-art brain-age model, it is robust to domain shifts but
    shows the known trade-off between brain-age accuracy and disease detection.
  summary_de: >-
    Wir haben ein tiefes neuronales Netz an mehr als 50.000 Menschen zur Vorhersage des Hirnalters
    trainiert und auf klinische Vorhersagen übertragen. Das zeigt, dass Skalierung auch beim Deep
    Learning in der Bildgebung zählt. In einem unabhängigen Benchmark erwies es sich als
    State-of-the-Art-Modell für das Hirnalter. Es ist robust gegenüber Domänenverschiebungen, zeigt aber
    den bekannten Zielkonflikt zwischen Genauigkeit des Hirnalters und Erkennung von Erkrankungen.
- year: 2022
  title: Charting brain growth and aging at high spatial precision
  venue: eLife
  link: https://doi.org/10.7554/eLife.72904
  link_text: Paper
  summary: >-
    We charted normative models of the human brain at high spatial precision from more than 50,000
    people. The models transfer to new samples and are freely available online for other researchers.
  summary_de: >-
    Wir haben normative Modelle des menschlichen Gehirns mit hoher räumlicher Präzision aus Daten von
    mehr als 50.000 Menschen erstellt. Die Modelle lassen sich auf neue Stichproben übertragen und
    stehen anderen Forschenden frei online zur Verfügung.
- year: 2022
  title: The normative modeling framework for computational psychiatry
  venue: Nature Protocols
  link: https://doi.org/10.1038/s41596-022-00696-5
  link_text: Paper
  summary: >-
    We describe the principles of normative modeling for computational psychiatry and provide accessible
    tools for analyzing data within this framework.
  summary_de: >-
    Wir beschreiben die Prinzipien der normativen Modellierung für die computationale Psychiatrie und
    stellen zugängliche Werkzeuge zur Datenanalyse in diesem Rahmen bereit.
- year: 2021
  title: Replicating extensive brain structural heterogeneity in individuals with schizophrenia and bipolar
    disorder
  venue: Human Brain Mapping
  link: https://doi.org/10.1002/hbm.25386
  link_text: Paper
  summary: >-
    We replicated our earlier finding that people with schizophrenia and bipolar disorder show
    individual profiles of deviation from the normative brain. Other groups have since replicated this,
    and it extends to further mental and neurological conditions.
  summary_de: >-
    Wir haben unseren früheren Befund repliziert, dass Menschen mit Schizophrenie und bipolarer Störung
    individuelle Profile von Abweichungen vom normativen Gehirn zeigen. Andere Gruppen haben dies
    bestätigt, und der Befund gilt auch für weitere psychische und neurologische Erkrankungen.
- year: 2019
  title: Inter-individual differences in human brain structure and morphology link to variation in demographics
    and behavior
  venue: eLife
  link: https://doi.org/10.7554/eLife.44443
  link_text: Paper
  summary: >-
    We show that brain structure explains a large proportion of the functional interactions between
    regions in the healthy human brain.
  summary_de: >-
    Wir zeigen, dass die Hirnstruktur einen großen Teil der funktionellen Interaktionen zwischen
    Regionen im gesunden menschlichen Gehirn erklärt.
- year: 2019
  title: 'Individual differences v. the average patient: mapping the heterogeneity in ADHD using normative
    models'
  venue: Psychological Medicine
  link: https://doi.org/10.1017/S0033291719000084
  link_text: Paper
  summary: >-
    We mapped the heterogeneity of ADHD at the level of the individual patient: each patient showed a
    distinct profile of deviations from the normative brain, extending our finding in schizophrenia.
  summary_de: >-
    Wir haben die Heterogenität der ADHS auf der Ebene einzelner Patientinnen und Patienten kartiert:
    Jede Person zeigte ein eigenes Profil von Abweichungen vom normativen Gehirn. Damit erweitern wir
    unseren Befund zur Schizophrenie.
- year: 2018
  title: Mapping the heterogeneous phenotype of schizophrenia and bipolar disorder using normative models
  venue: JAMA Psychiatry
  link: https://doi.org/10.1001/jamapsychiatry.2018.2467
  link_text: Paper
  summary: >-
    We mapped the heterogeneity of schizophrenia and bipolar disorder and found that each patient shows
    an individual profile of deviations from the normative brain structure. The media framed the finding
    as "Who is the average patient in psychiatry?", and it has since been replicated many times across
    data modalities, algorithms, and samples.
  summary_de: >-
    Wir haben die Heterogenität von Schizophrenie und bipolarer Störung kartiert und gezeigt, dass jede
    Patientin und jeder Patient ein individuelles Profil von Abweichungen von der normativen
    Hirnstruktur aufweist. Die Medien griffen den Befund unter der Frage "Wer ist der durchschnittliche
    Patient in der Psychiatrie?" auf. Er wurde seither vielfach mit unterschiedlichen Datenmodalitäten,
    Algorithmen und Stichproben repliziert.
- year: 2015
  title: 'From estimating activation locality to predicting disorder: a review of pattern recognition
    for neuroimaging-based psychiatric diagnostics'
  venue: Neuroscience & Biobehavioral Reviews
  link: https://doi.org/10.1016/j.neubiorev.2015.08.001
  link_text: Paper
  summary: >-
    We showed that the accuracy of pattern classification for predicting mental disorders decreases as
    sample size increases, the opposite of what machine learning usually shows. We attribute this partly
    to the heterogeneity of mental disorders and to publication bias toward well-performing but
    unrepresentative models. The work contributed to a debate on cross-validation failures and motivated
    methods that map this heterogeneity.
  summary_de: >-
    Wir haben gezeigt, dass die Genauigkeit von Mustererkennungsverfahren zur Vorhersage psychischer
    Störungen mit wachsender Stichprobengröße abnimmt, also das Gegenteil dessen, was maschinelles
    Lernen üblicherweise zeigt. Wir führen dies teilweise auf die Heterogenität psychischer Störungen
    und auf einen Publikationsbias zugunsten leistungsstarker, aber nicht repräsentativer Modelle
    zurück. Die Arbeit trug zu einer Debatte über Fehler bei der Kreuzvalidierung bei und motivierte
    Methoden, die diese Heterogenität abbilden.
