    हमने 50,000 से अधिक लोगों के डेटा से उच्च स्थानिक सटीकता के साथ मानव मस्तिष्क के नॉर्मेटिव मॉडल तैयार किए। ये मॉडल नए नमूनों पर भी लागू होते हैं और अन्य शोधकर्ताओं के लिए ऑनलाइन निःशुल्क उपलब्ध हैं।
  summary_es: >-
    Trazamos modelos normativos del cerebro humano con alta precisión espacial a partir de datos de más de 50 000 personas. Los modelos se pueden transferir a nuevas muestras y están disponibles en línea de forma gratuita para otros investigadores.
  summary_fr: >-
    Nous avons établi des modèles normatifs du cerveau humain à haute précision spatiale à partir de plus de 50 000 personnes. Ces modèles se transfèrent à de nouveaux échantillons et sont librement accessibles en ligne pour d’autres chercheurs.
