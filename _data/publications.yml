  first_author: Segal
  title: Regional, circuit and network heterogeneity of brain abnormalities in psychiatric disorders
  venue: Nature Neuroscience
  link: https://www.nature.com/articles/s41593-023-01404-6
  link_text: Paper
  summary: >-
    We applied normative models across several mental disorders and characterized individual deviations
    at the voxel, regional, and network levels of the brain. Deviations overlap more across individuals
    at the network level.
  summary_de: >-
    Wir haben normative Modelle auf mehrere psychische Störungen angewendet und individuelle
    Abweichungen auf Voxel-, Regions- und Netzwerkebene des Gehirns charakterisiert. Auf Netzwerkebene
    überschneiden sich die Abweichungen zwischen Personen stärker.
  summary_zh: 我们将常模模型应用于多种精神障碍，在体素、脑区和网络层面刻画个体偏离。在网络层面，不同个体之间的偏离重叠程度更高。
  summary_hi: >-
    हमने कई मानसिक विकारों में नॉर्मेटिव मॉडल लागू किए और मस्तिष्क के वॉक्सेल, क्षेत्र और नेटवर्क स्तरों पर व्यक्तिगत विचलनों का विश्लेषण किया। नेटवर्क स्तर पर अलग-अलग व्यक्तियों के विचलन आपस में अधिक मेल खाते हैं।
  summary_es: >-
    Aplicamos modelos normativos a varios trastornos mentales y caracterizamos las desviaciones individuales en el cerebro a nivel de vóxel, de región y de red. Las desviaciones se solapan más entre individuos a nivel de red.
  summary_fr: >-
    Nous avons appliqué des modèles normatifs à plusieurs troubles mentaux et caractérisé les écarts individuels à l’échelle du voxel, de la région et du réseau cérébral. Les écarts se recoupent davantage d’une personne à l’autre à l’échelle des réseaux.
- year: 2022
  first_author: Leonardsen
  title: Deep neural networks learn general and clinically relevant representations of the ageing brain
  venue: NeuroImage
  link: https://doi.org/10.1016/j.neuroimage.2022.119210
  link_text: Paper
  summary: >-
    We trained a deep neural network on more than 50,000 people to predict brain age and transferred it
    to clinical prediction tasks, showing that scale matters for deep learning in neuroimaging.
    Independently benchmarked as a state-of-the-art brain-age model, it is robust to domain shifts but
    shows the known trade-off between brain-age accuracy and disease detection.
  summary_de: >-
    Wir haben ein tiefes neuronales Netz an mehr als 50.000 Menschen zur Vorhersage des Hirnalters
    trainiert und auf klinische Vorhersagen übertragen. Das zeigt, dass Skalierung auch beim Deep
    Learning in der Bildgebung zählt. In einem unabhängigen Benchmark erwies es sich als
    State-of-the-Art-Modell für das Hirnalter. Es ist robust gegenüber Domänenverschiebungen, zeigt aber
    den bekannten Zielkonflikt zwischen Genauigkeit des Hirnalters und Erkennung von Erkrankungen.
  summary_zh: >-
    我们基于五万多人的数据训练深度神经网络来预测脑龄，并将其迁移到临床预测任务中，表明数据规模对神经影像中的深度学习至关重要。该模型经独立评测被列为最先进的脑龄模型之一，对领域偏移具有稳健性，但也表现出脑龄预测准确性与疾病检测能力之间已知的权衡。
  summary_hi: >-
    हमने मस्तिष्क-आयु (ब्रेन एज) का अनुमान लगाने के लिए 50,000 से अधिक लोगों के डेटा पर एक डीप न्यूरल नेटवर्क प्रशिक्षित किया और उसे नैदानिक पूर्वानुमान के कार्यों में स्थानांतरित किया। इससे पता चलता है कि न्यूरोइमेजिंग में डीप लर्निंग के लिए डेटा का पैमाना मायने रखता है। स्वतंत्र बेंचमार्क में अत्याधुनिक मस्तिष्क-आयु मॉडल के रूप में आँका गया यह मॉडल डोमेन शिफ़्ट के प्रति मज़बूत है, लेकिन मस्तिष्क-आयु की सटीकता और रोग की पहचान के बीच पहले से ज्ञात संतुलन (ट्रेड-ऑफ़) को भी दर्शाता है।
  summary_es: >-
    Entrenamos una red neuronal profunda con datos de más de 50 000 personas para predecir la edad cerebral y la transferimos a tareas de predicción clínica, lo que demuestra que la escala importa en el aprendizaje profundo aplicado a la neuroimagen. Una evaluación independiente la sitúa entre los modelos de edad cerebral más avanzados. Es robusta frente a los cambios de dominio, pero muestra el conocido compromiso entre la precisión en la edad cerebral y la detección de enfermedades.
  summary_fr: >-
    Nous avons entraîné un réseau de neurones profond sur plus de 50 000 personnes pour prédire l’âge cérébral, puis nous l’avons transféré à des tâches de prédiction clinique, montrant que l’échelle compte pour l’apprentissage profond en neuro-imagerie. Évalué de manière indépendante comme un modèle d’âge cérébral de pointe, il résiste bien aux changements de domaine, mais présente le compromis connu entre précision de l’âge cérébral et détection des maladies.
