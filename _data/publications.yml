  summary_zh: 我们在单个患者层面描绘了注意缺陷多动障碍（ADHD）的异质性：每位患者都表现出偏离常模大脑的独特模式，这扩展了我们在精神分裂症中的发现。
  summary_hi: >-
    हमने व्यक्तिगत मरीज़ के स्तर पर ADHD की विषमता का मानचित्रण किया: हर मरीज़ ने नॉर्मेटिव मस्तिष्क से विचलनों का एक अलग प्रोफ़ाइल दिखाया, जिससे स्किज़ोफ़्रेनिया पर हमारा निष्कर्ष और व्यापक हुआ।
  summary_es: >-
    Mapeamos la heterogeneidad del TDAH a nivel de cada paciente: cada paciente mostró un perfil distinto de desviaciones respecto al cerebro normativo, lo que amplía nuestro hallazgo en la esquizofrenia.
  summary_fr: >-
    Nous avons cartographié l’hétérogénéité du TDAH à l’échelle de chaque patient : chaque patient présentait un profil distinct d’écarts par rapport au cerveau normatif, ce qui prolonge notre résultat obtenu dans la schizophrénie.
- year: 2018
  first_author: Wolfers
  title: Mapping the heterogeneous phenotype of schizophrenia and bipolar disorder using normative models
  venue: JAMA Psychiatry
  link: https://doi.org/10.1001/jamapsychiatry.2018.2467
  link_text: Paper
  summary: >-
    We mapped the heterogeneity of schizophrenia and bipolar disorder and found that each patient shows
    an individual profile of deviations from the normative brain structure. The media framed the finding
    as "Who is the average patient in psychiatry?", and it has since been replicated many times across
    data modalities, algorithms, and samples.
  summary_de: >-
    Wir haben die Heterogenität von Schizophrenie und bipolarer Störung kartiert und gezeigt, dass jede
    Patientin und jeder Patient ein individuelles Profil von Abweichungen von der normativen
    Hirnstruktur aufweist. Die Medien griffen den Befund unter der Frage "Wer ist der durchschnittliche
    Patient in der Psychiatrie?" auf. Er wurde seither vielfach mit unterschiedlichen Datenmodalitäten,
    Algorithmen und Stichproben repliziert.
  summary_zh: >-
    我们描绘了精神分裂症和双相障碍的异质性，发现每位患者都表现出偏离常模脑结构的个体化模式。媒体以“谁是精神病学中的平均患者？”为题报道了这一发现。此后，这一发现已在不同的数据模态、算法和样本中被多次重复验证。
  summary_hi: >-
    हमने स्किज़ोफ़्रेनिया और बाइपोलर डिसऑर्डर की विषमता का मानचित्रण किया और पाया कि हर मरीज़ नॉर्मेटिव मस्तिष्क-संरचना से विचलनों का एक व्यक्तिगत प्रोफ़ाइल दिखाता है। मीडिया ने इस निष्कर्ष को "मनोचिकित्सा में औसत मरीज़ कौन है?" के रूप में प्रस्तुत किया, और तब से विभिन्न डेटा मोडैलिटी, एल्गोरिदम और नमूनों में कई बार इसकी पुष्टि हो चुकी है।
  summary_es: >-
    Mapeamos la heterogeneidad de la esquizofrenia y el trastorno bipolar y observamos que cada paciente presenta un perfil individual de desviaciones respecto a la estructura cerebral normativa. Los medios de comunicación presentaron el hallazgo con la pregunta “¿Quién es el paciente promedio en psiquiatría?”, y desde entonces se ha replicado muchas veces con distintas modalidades de datos, algoritmos y muestras.
  summary_fr: >-
    Nous avons cartographié l’hétérogénéité de la schizophrénie et du trouble bipolaire et constaté que chaque patient présente un profil individuel d’écarts par rapport à la structure cérébrale normative. Les médias ont résumé ce résultat par la question « Qui est le patient moyen en psychiatrie ? », et il a depuis été reproduit à de nombreuses reprises, avec diverses modalités de données, divers algorithmes et divers échantillons.
- year: 2015
  first_author: Wolfers
  title: 'From estimating activation locality to predicting disorder: a review of pattern recognition
    for neuroimaging-based psychiatric diagnostics'
  venue: Neuroscience & Biobehavioral Reviews
  link: https://doi.org/10.1016/j.neubiorev.2015.08.001
  link_text: Paper
  summary: >-
    We showed that the accuracy of pattern classification for predicting mental disorders decreases as
    sample size increases, the opposite of what machine learning usually shows. We attribute this partly
    to the heterogeneity of mental disorders and to publication bias toward well-performing but
    unrepresentative models. The work contributed to a debate on cross-validation failures and motivated
    methods that map this heterogeneity.
  summary_de: >-
    Wir haben gezeigt, dass die Genauigkeit von Mustererkennungsverfahren zur Vorhersage psychischer
    Störungen mit wachsender Stichprobengröße abnimmt, also das Gegenteil dessen, was maschinelles
    Lernen üblicherweise zeigt. Wir führen dies teilweise auf die Heterogenität psychischer Störungen
    und auf einen Publikationsbias zugunsten leistungsstarker, aber nicht repräsentativer Modelle
    zurück. Die Arbeit trug zu einer Debatte über Fehler bei der Kreuzvalidierung bei und motivierte
    Methoden, die diese Heterogenität abbilden.
  summary_zh: >-
    我们发现，利用模式分类预测精神障碍时，准确率随样本量增大而下降，这与机器学习中通常观察到的情况相反。我们认为，这部分源于精神障碍的异质性，也源于发表偏倚，即表现良好但缺乏代表性的模型更容易得到发表。这项工作推动了关于交叉验证失效的讨论，并促使人们开发能够刻画这种异质性的方法。
  summary_hi: >-
    हमने दिखाया कि मानसिक विकारों के पूर्वानुमान के लिए पैटर्न क्लासिफ़िकेशन की सटीकता नमूने का आकार बढ़ने के साथ घटती है, जो मशीन लर्निंग में आमतौर पर दिखने वाले रुझान के विपरीत है। हम इसका कारण आंशिक रूप से मानसिक विकारों की विषमता को, और आंशिक रूप से अच्छे प्रदर्शन वाले पर प्रतिनिधित्व न करने वाले मॉडलों के पक्ष में प्रकाशन पूर्वाग्रह को मानते हैं। इस काम ने क्रॉस-वैलिडेशन की विफलताओं पर चल रही बहस में योगदान दिया और ऐसी पद्धतियों को प्रेरित किया जो इस विषमता का मानचित्रण करती हैं।
  summary_es: >-
    Mostramos que la precisión de la clasificación de patrones para predecir trastornos mentales disminuye a medida que aumenta el tamaño de la muestra, lo contrario de lo que suele observarse en el aprendizaje automático. Lo atribuimos en parte a la heterogeneidad de los trastornos mentales y a un sesgo de publicación a favor de modelos con buen rendimiento pero poco representativos. El trabajo contribuyó a un debate sobre los fallos de la validación cruzada y motivó métodos que mapean esta heterogeneidad.
  summary_fr: >-
    Nous avons montré que la précision de la classification de motifs pour prédire les troubles mentaux diminue lorsque la taille de l’échantillon augmente, contrairement à ce que l’on observe habituellement en apprentissage automatique. Nous l’attribuons en partie à l’hétérogénéité des troubles mentaux et à un biais de publication en faveur de modèles performants mais peu représentatifs. Ce travail a nourri un débat sur les échecs de la validation croisée et a motivé le développement de méthodes qui cartographient cette hétérogénéité.
