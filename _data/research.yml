# RESEARCH THEMES (homepage cards and the clickable icons on the Research page)
# short: one line for the homepage card. text: opening sentences, guiding questions as a list ("- "),
# then "Example questions:" and at most two questions (always last). *_de: the same in German. Keep a blank line before and after the list.

- name: Foundations
  name_de: Grundlagen
  title: Foundations of Mental Health Mapping
  title_de: Grundlagen des Mental Health Mapping
  image: theme_foundations.jpg
  short: What is healthy, and what is a disorder?
  short_de: Was ist gesund, und was ist eine Störung?
  text: |-
    We study the foundations of health, disorder, and disease, where what counts as healthy or normative is often unclear. This work builds the theoretical foundation of mental health mapping, incorporating first- and third-person perspectives. Across all our themes, we work with people living with mental and neurological disorders, clinicians, philosophers, and scientists.

    Example questions:

    - Where does normal variation end and a disorder begin?
    - Against which reference population should a person be compared?
  text_de: |-
    Wir untersuchen die Grundlagen von Gesundheit, Störung und Krankheit, denn was als gesund oder normativ gilt, ist oft unklar. Diese Arbeit schafft das theoretische Fundament des Mental Health Mapping und bezieht die Perspektive der ersten wie der dritten Person ein. In allen unseren Themen arbeiten wir mit Menschen mit psychischen und neurologischen Erkrankungen, Klinikerinnen und Klinikern, Philosophinnen und Philosophen sowie Forschenden zusammen.

    Beispielfragen:

    - Wo endet normale Variation, und wo beginnt eine Erkrankung?
    - Mit welcher Referenzpopulation sollte ein Mensch verglichen werden?
  name_zh: 基础
  title_zh: Mental Health Mapping 的基础
  short_zh: 什么是健康，什么是障碍？
  text_zh: |-
    我们研究健康、障碍与疾病的基础问题，而在这些问题上，什么算作健康或常态往往并不清楚。这项工作为 Mental Health Mapping 奠定理论基础，同时纳入第一人称和第三人称视角。在所有研究主题中，我们都同精神与神经系统疾病患者、临床医生、哲学家和科学家合作。

    示例问题：

    - 正常变异的边界在哪里，障碍又从何处开始？
    - 应当将一个人与哪个参照人群进行比较？
  name_hi: आधार
  title_hi: Mental Health Mapping के आधार
  short_hi: क्या स्वस्थ है, और विकार क्या है?
  text_hi: |-
    हम स्वास्थ्य, विकार और रोग के आधारों का अध्ययन करते हैं, जहाँ अक्सर यह स्पष्ट नहीं होता कि किसे स्वस्थ या सामान्य (नॉर्मेटिव) माना जाए। यह काम Mental Health Mapping की सैद्धांतिक नींव तैयार करता है और इसमें व्यक्ति के अपने अनुभव (फ़र्स्ट-पर्सन) और बाहरी अवलोकन (थर्ड-पर्सन), दोनों दृष्टिकोण शामिल होते हैं। अपने सभी विषयों में हम मानसिक और तंत्रिका संबंधी विकारों के साथ जी रहे लोगों, चिकित्सकों, दार्शनिकों और वैज्ञानिकों के साथ मिलकर काम करते हैं।

    उदाहरण प्रश्न:

    - सामान्य भिन्नता कहाँ समाप्त होती है और विकार कहाँ से शुरू होता है?
    - किसी व्यक्ति की तुलना किस संदर्भ आबादी से की जानी चाहिए?
  name_es: Fundamentos
  title_es: Fundamentos del Mental Health Mapping
  short_es: ¿Qué es estar sano y qué es un trastorno?
  text_es: |-
    Estudiamos los fundamentos de la salud, el trastorno y la enfermedad, un terreno en el que a menudo no está claro qué se considera sano o normativo. Este trabajo construye la base teórica del Mental Health Mapping e incorpora las perspectivas en primera y en tercera persona. En todas nuestras líneas de investigación trabajamos con personas que viven con trastornos mentales y neurológicos, profesionales clínicos, filósofos y científicos.

    Preguntas de ejemplo:

    - ¿Dónde termina la variación normal y dónde empieza un trastorno?
    - ¿Con qué población de referencia debería compararse a una persona?
  name_fr: Fondements
  title_fr: Fondements du Mental Health Mapping
  short_fr: Qu’est-ce qui est sain, et qu’est-ce qu’un trouble ?
  text_fr: |-
    Nous étudions les fondements de la santé, du trouble et de la maladie, là où ce qui est considéré comme sain ou normatif reste souvent flou. Ces travaux posent les bases théoriques du Mental Health Mapping en intégrant les perspectives à la première et à la troisième personne. Dans tous nos thèmes, nous travaillons avec des personnes vivant avec des troubles mentaux et neurologiques, des cliniciens, des philosophes et des scientifiques.

    Exemples de questions :

    - Où s’arrête la variation normale et où commence un trouble ?
    - À quelle population de référence faut-il comparer une personne ?

- name: Structures
  name_de: Strukturen
  title: Structures of Mental Health Mapping
  title_de: Strukturen des Mental Health Mapping
  image: theme_structures.jpg
  short: From biology to families and society.
  short_de: Von der Biologie bis zu Familie und Gesellschaft.
  text: |-
    Mental and neurological disorders are heritable, comorbid, and heterogeneous. Their structure can lie in an individual's biology, in the dynamics between people, groups, or parts of society, or in environmental stressors. We work on large-scale studies that capture these levels.

    Example questions:

    - Why does one sibling develop a disorder while another stays healthy?
    - How do families, society, and environment shape mental and neurological disorders?
  text_de: |-
    Psychische und neurologische Erkrankungen sind erblich, treten häufig gemeinsam auf und sind heterogen. Ihre Struktur kann in der Biologie eines Menschen liegen, in der Dynamik zwischen Menschen, Gruppen oder Teilen der Gesellschaft oder in Belastungen aus der Umwelt. Wir arbeiten an groß angelegten Studien, die diese Ebenen erfassen.

    Beispielfragen:

    - Warum erkrankt ein Geschwisterkind, während ein anderes gesund bleibt?
    - Wie prägen Familie, Gesellschaft und Umwelt psychische und neurologische Erkrankungen?
  name_zh: 结构
  title_zh: Mental Health Mapping 的结构
  short_zh: 从生物学到家庭与社会。
  text_zh: |-
    精神与神经系统疾病具有遗传性、共病性和异质性。其结构可能存在于个体的生物学层面，存在于个人、群体或社会各部分之间的互动之中，也可能来自环境压力。我们开展覆盖这些层面的大规模研究。

    示例问题：

    - 为什么兄弟姐妹中一人患病，另一人却保持健康？
    - 家庭、社会和环境如何影响精神与神经系统疾病？
  name_hi: संरचनाएँ
  title_hi: Mental Health Mapping की संरचनाएँ
  short_hi: जीव-विज्ञान से परिवार और समाज तक।
  text_hi: |-
    मानसिक और तंत्रिका संबंधी विकार वंशानुगत होते हैं, अक्सर एक-दूसरे के साथ पाए जाते हैं (सहरुग्णता), और व्यक्ति-दर-व्यक्ति बहुत भिन्न होते हैं (विषमता)। उनकी संरचना व्यक्ति की जैविक बनावट में, लोगों, समूहों या समाज के विभिन्न हिस्सों के बीच की गतिशीलता में, या पर्यावरणीय तनाव-कारकों में हो सकती है। हम ऐसे बड़े पैमाने के अध्ययनों पर काम करते हैं जो इन सभी स्तरों को समेटते हैं।

    उदाहरण प्रश्न:

    - भाई-बहनों में से एक में विकार क्यों विकसित होता है, जबकि दूसरा स्वस्थ रहता है?
    - परिवार, समाज और पर्यावरण मानसिक और तंत्रिका संबंधी विकारों को कैसे आकार देते हैं?
  name_es: Estructuras
  title_es: Estructuras del Mental Health Mapping
  short_es: De la biología a las familias y la sociedad.
  text_es: |-
    Los trastornos mentales y neurológicos son heredables, comórbidos y heterogéneos. Su estructura puede encontrarse en la biología de una persona, en la dinámica entre personas, grupos o sectores de la sociedad, o en factores de estrés ambientales. Trabajamos en estudios a gran escala que abarcan estos niveles.

    Preguntas de ejemplo:

    - ¿Por qué un hermano desarrolla un trastorno mientras otro sigue sano?
    - ¿Cómo influyen la familia, la sociedad y el entorno en los trastornos mentales y neurológicos?
  name_fr: Structures
  title_fr: Structures du Mental Health Mapping
  short_fr: De la biologie à la famille et à la société.
  text_fr: |-
    Les troubles mentaux et neurologiques sont héréditaires, souvent associés entre eux et hétérogènes. Leur structure peut se situer dans la biologie d’une personne, dans les dynamiques entre les personnes, les groupes ou les composantes de la société, ou encore dans des facteurs de stress environnementaux. Nous menons des études à grande échelle qui couvrent ces différents niveaux.

    Exemples de questions :

    - Pourquoi un enfant d’une fratrie développe-t-il un trouble alors qu’un autre reste en bonne santé ?
    - Comment la famille, la société et l’environnement façonnent-ils les troubles mentaux et neurologiques ?

- name: Markers
  name_de: Marker
  title: Markers for Mental Health Mapping
  title_de: Marker für das Mental Health Mapping
  image: theme_markers.jpg
  short: The hidden factors behind disorders.
  short_de: Die verborgenen Faktoren hinter Erkrankungen.
  text: |-
    A complex web of biological and non-biological factors produces symptoms in each individual, which is one reason we know little about markers of most mental and some neurological disorders. With multimodal approaches, we aim to detect the hidden factors underlying them.

    Example questions:

    - Why do two people with the same diagnosis differ so much?
    - Which measurements (brain, genes, behavior, or language) predict how a disorder will develop?
  text_de: |-
    Ein komplexes Geflecht biologischer und nicht-biologischer Faktoren erzeugt bei jedem Menschen Symptome. Das ist ein Grund, warum wir über Marker der meisten psychischen und mancher neurologischen Erkrankungen wenig wissen. Mit multimodalen Ansätzen wollen wir die verborgenen Faktoren hinter Erkrankungen aufdecken.

    Beispielfragen:

    - Warum unterscheiden sich zwei Menschen mit derselben Diagnose so stark?
    - Welche Messungen (Gehirn, Gene, Verhalten oder Sprache) sagen voraus, wie sich eine Erkrankung entwickelt?
  name_zh: 标志物
  title_zh: Mental Health Mapping 的标志物
  short_zh: 疾病背后的隐藏因素。
  text_zh: |-
    生物与非生物因素交织成一张复杂的网，在每个人身上产生症状，这也是我们对大多数精神疾病和部分神经系统疾病的标志物知之甚少的原因之一。我们希望借助多模态方法，发现其背后的隐藏因素。

    示例问题：

    - 为什么诊断相同的两个人会有如此大的差异？
    - 哪些测量指标（脑、基因、行为或语言）能够预测疾病的发展？
  name_hi: मार्कर
  title_hi: Mental Health Mapping के लिए मार्कर
  short_hi: विकारों के पीछे छिपे कारक।
  text_hi: |-
    जैविक और गैर-जैविक कारकों का एक जटिल जाल हर व्यक्ति में लक्षण उत्पन्न करता है। यही एक कारण है कि अधिकांश मानसिक और कुछ तंत्रिका संबंधी विकारों के मार्करों के बारे में हम बहुत कम जानते हैं। मल्टीमोडल दृष्टिकोणों के माध्यम से हमारा लक्ष्य इन विकारों के पीछे छिपे कारकों का पता लगाना है।

    उदाहरण प्रश्न:

    - एक ही निदान वाले दो लोग एक-दूसरे से इतने अलग क्यों होते हैं?
    - कौन-से माप (मस्तिष्क, जीन, व्यवहार या भाषा) यह बता सकते हैं कि कोई विकार आगे कैसे विकसित होगा?
  name_es: Marcadores
  title_es: Marcadores para el Mental Health Mapping
  short_es: Los factores ocultos detrás de los trastornos.
  text_es: |-
    Una compleja red de factores biológicos y no biológicos produce síntomas en cada persona, y esa es una de las razones por las que sabemos poco sobre los marcadores de la mayoría de los trastornos mentales y de algunos neurológicos. Con enfoques multimodales, queremos detectar los factores ocultos que hay detrás de ellos.

    Preguntas de ejemplo:

    - ¿Por qué dos personas con el mismo diagnóstico se diferencian tanto?
    - ¿Qué mediciones (cerebro, genes, conducta o lenguaje) predicen cómo evolucionará un trastorno?
  name_fr: Marqueurs
  title_fr: Marqueurs pour le Mental Health Mapping
  short_fr: Les facteurs cachés derrière les troubles.
  text_fr: |-
    Un réseau complexe de facteurs biologiques et non biologiques produit des symptômes chez chaque personne. C’est l’une des raisons pour lesquelles nous connaissons mal les marqueurs de la plupart des troubles mentaux et de certains troubles neurologiques. Grâce à des approches multimodales, nous cherchons à détecter les facteurs cachés qui les sous-tendent.

    Exemples de questions :

    - Pourquoi deux personnes ayant le même diagnostic sont-elles si différentes ?
    - Quelles mesures (cerveau, gènes, comportement ou langage) permettent de prédire l’évolution d’un trouble ?

- name: Models
  name_de: Modelle
  title: Models for Mental Health Mapping
  title_de: Modelle für das Mental Health Mapping
  image: theme_models.jpg
  short: Machine learning, from lab to clinic.
  short_de: Maschinelles Lernen, vom Labor in die Klinik.
  text: |-
    Most of our research relies on machine learning. We apply and develop methods for large-scale imaging, electrophysiological, genetic, sensor, cognitive, behavioral, and language data, which are high-dimensional and often come with unreliable labels. We hold ourselves to a simple benchmark: for many brain readouts, well-specified regression models perform as well as more complex AI methods, and we report this honestly.

    Example questions:

    - Which methods capture the heterogeneity within and across disorders?
    - How do we build models interpretable enough to be used in the clinic?
  text_de: |-
    Der Großteil unserer Forschung beruht auf maschinellem Lernen. Wir wenden Methoden für groß angelegte Bildgebungs-, elektrophysiologische, genetische, Sensor-, kognitive, Verhaltens- und Sprachdaten an und entwickeln sie weiter. Diese Daten sind hochdimensional und oft mit unzuverlässigen Labels versehen. Wir halten uns an einen einfachen Maßstab: Für viele Messgrößen des Gehirns schneiden gut spezifizierte Regressionsmodelle ebenso gut ab wie komplexere KI-Methoden, und das berichten wir offen.

    Beispielfragen:

    - Welche Methoden erfassen die Heterogenität innerhalb von und zwischen Erkrankungen?
    - Wie entwickeln wir Modelle, die interpretierbar genug für den Einsatz in der Klinik sind?
  name_zh: 模型
  title_zh: Mental Health Mapping 的模型
  short_zh: 机器学习，从实验室走向临床。
  text_zh: |-
    我们的大部分研究依赖于机器学习。我们针对大规模的影像、电生理、遗传、传感器、认知、行为和语言数据应用并开发方法，这些数据维度高，标签也往往不可靠。我们为自己设定了一个简单的基准：对于许多脑测量指标，设定合理的回归模型与更复杂的人工智能方法表现相当，我们会如实报告这一点。

    示例问题：

    - 哪些方法能够刻画疾病内部及疾病之间的异质性？
    - 如何构建足够可解释、能够用于临床的模型？
  name_hi: मॉडल
  title_hi: Mental Health Mapping के लिए मॉडल
  short_hi: मशीन लर्निंग, प्रयोगशाला से क्लिनिक तक।
  text_hi: |-
    हमारा अधिकांश शोध मशीन लर्निंग पर आधारित है। हम बड़े पैमाने के इमेजिंग, इलेक्ट्रोफ़िज़ियोलॉजिकल, आनुवंशिक, सेंसर, संज्ञानात्मक, व्यवहार संबंधी और भाषा डेटा के लिए पद्धतियाँ लागू करते हैं और नई पद्धतियाँ विकसित करते हैं। यह डेटा उच्च-आयामी होता है और इसके लेबल अक्सर विश्वसनीय नहीं होते। हम अपने लिए एक सरल कसौटी रखते हैं: मस्तिष्क के कई मापों के लिए सही ढंग से निर्दिष्ट रिग्रेशन मॉडल अधिक जटिल एआई पद्धतियों जितना ही अच्छा प्रदर्शन करते हैं, और हम इसे ईमानदारी से रिपोर्ट करते हैं।

    उदाहरण प्रश्न:

    - कौन-सी पद्धतियाँ विकारों के भीतर और उनके बीच की विषमता को पकड़ पाती हैं?
    - हम ऐसे मॉडल कैसे बनाएँ जो इतने समझने योग्य (इंटरप्रिटेबल) हों कि उनका क्लिनिक में उपयोग किया जा सके?
  name_es: Modelos
  title_es: Modelos para el Mental Health Mapping
  short_es: Aprendizaje automático, del laboratorio a la clínica.
  text_es: |-
    La mayor parte de nuestra investigación se basa en el aprendizaje automático. Aplicamos y desarrollamos métodos para datos a gran escala de imagen, electrofisiológicos, genéticos, de sensores, cognitivos, conductuales y de lenguaje, que son de alta dimensionalidad y a menudo tienen etiquetas poco fiables. Nos exigimos un criterio sencillo: para muchas medidas cerebrales, los modelos de regresión bien especificados funcionan tan bien como métodos de IA más complejos, y lo comunicamos con honestidad.

    Preguntas de ejemplo:

    - ¿Qué métodos captan la heterogeneidad dentro de los trastornos y entre ellos?
    - ¿Cómo construimos modelos lo bastante interpretables para usarlos en la clínica?
  name_fr: Modèles
  title_fr: Modèles pour le Mental Health Mapping
  short_fr: L’apprentissage automatique, du laboratoire à la clinique.
  text_fr: |-
    La plupart de nos recherches reposent sur l’apprentissage automatique. Nous appliquons et développons des méthodes pour des données à grande échelle d’imagerie, d’électrophysiologie, de génétique, de capteurs, de cognition, de comportement et de langage. Ces données sont de grande dimension et leurs étiquettes sont souvent peu fiables. Nous nous fixons une référence simple : pour de nombreuses mesures cérébrales, des modèles de régression bien spécifiés font aussi bien que des méthodes d’IA plus complexes, et nous le rapportons honnêtement.

    Exemples de questions :

    - Quelles méthodes rendent compte de l’hétérogénéité au sein des troubles et entre eux ?
    - Comment construire des modèles suffisamment interprétables pour être utilisés en clinique ?
