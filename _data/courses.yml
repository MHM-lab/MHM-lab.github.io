- id: parsing-individual-differences
  title: "Parsing Individual Differences in Brain Disorders"
  when: "Winter term · three weekends in November"
  when_de: "Wintersemester · drei Wochenenden im November"
  teaser: >-
    This course **introduces the foundations of individual-level inference in mental health**, with a
    focus on normative modeling, and is structured into three parts.
  teaser_de: >-
    Dieser Kurs **führt in die Grundlagen der Inferenz auf der Ebene des Individuums in der Forschung
    zur psychischen Gesundheit ein**, mit Schwerpunkt auf normativer Modellierung, und gliedert sich in
    drei Teile.
  details: >-
    In **Part I**, students read *An Unquiet Mind* by Kay Redfield Jamison, a memoir by a scientist
    living with bipolar disorder, and discuss lived experience, representation, and the diversity of how
    mental health conditions are expressed, motivating a shift beyond average-based case–control
    thinking. **Part II** introduces conceptual frameworks for individual differences, including HiTOP,
    RDoC, and normative modeling. Through lectures and student-led paper discussions, students examine
    deviation mapping, heterogeneity, and the promises and limitations of these approaches. In **Part
    III**, students learn what biomarkers are and how they are constructed, develop Python scripts to
    derive biomarkers from functional MRI data, and estimate normative models, gaining a practical
    understanding of how individual-level deviation scores are computed and why they constitute a
    central analytic currency in modern mental health research. If students wish to receive a grade for
    this course, assessment will be based on active participation, a presentation, and a written
    reflection on what they have learned during the course.
  details_de: >-
    In **Teil I** lesen die Studierenden *An Unquiet Mind* von Kay Redfield Jamison, die Memoiren einer
    Wissenschaftlerin, die mit einer bipolaren Störung lebt, und diskutieren gelebte Erfahrung,
    Repräsentation und die Vielfalt, in der sich psychische Erkrankungen äußern. Das motiviert einen
    Schritt über das am Durchschnitt orientierte Fall-Kontroll-Denken hinaus. **Teil II** führt in
    konzeptuelle Rahmenmodelle für individuelle Unterschiede ein, darunter HiTOP, RDoC und normative
    Modellierung. In Vorlesungen und von Studierenden geleiteten Paperdiskussionen beschäftigen sich die
    Studierenden mit Deviation Mapping, Heterogenität sowie den Chancen und Grenzen dieser Ansätze. In
    **Teil III** lernen die Studierenden, was Biomarker sind und wie sie konstruiert werden, entwickeln
    Python-Skripte, um Biomarker aus funktionellen MRT-Daten abzuleiten, und schätzen normative Modelle.
    So gewinnen sie ein praktisches Verständnis dafür, wie individuelle Abweichungswerte berechnet
    werden und warum sie eine zentrale analytische Währung der modernen Forschung zur psychischen
    Gesundheit sind. Wer für den Kurs eine Note erhalten möchte, wird auf Grundlage aktiver Teilnahme,
    eines Referats und einer schriftlichen Reflexion darüber bewertet, was sie im Kurs gelernt haben.

- id: fifty-ideas
  title: "The 50 Most Influential Ideas in Neuroscience, Psychology & Machine Learning"
  when: "Summer term · most Thursdays, 12:15–13:45"
  when_de: "Sommersemester · meist donnerstags, 12:15–13:45 Uhr"
  teaser: >-
    This course **surveys the ideas that have shaped modern neuroscience and traces their connections to
    psychology and machine learning**.
  teaser_de: >-
    Dieser Kurs **gibt einen Überblick über die Ideen, die die moderne Neurowissenschaft geprägt haben,
    und zeichnet ihre Verbindungen zu Psychologie und maschinellem Lernen nach**.
  details: >-
    Each year, 14 influential ideas are selected from a curated pool of 50 seminal concepts, with
    approximately eight drawn from neuroscience, three from psychology, and three from machine learning,
    anchoring the course in neuroscience while highlighting the ideas that have most profoundly
    transformed it. The selection is randomized each year, ensuring intellectual diversity, renewal, and
    a sense of discovery. Each lecture introduces a central idea alongside the key papers that defined
    its origin, impact, and influence across fields. Selected sessions include student-led presentations
    of seminal papers, encouraging critical evaluation and active participation. By the end of the
    course, students will have developed a broad, coherent overview of foundational ideas, an
    understanding of how they influenced one another, and a clear perspective on how neuroscience,
    psychology, and machine learning have jointly shaped contemporary thinking. If students wish to
    receive a grade for this course, assessment will be based on active participation and an in-depth
    critical evaluation of a research paper.
  details_de: >-
    Jedes Jahr werden 14 einflussreiche Ideen aus einem kuratierten Pool von 50 grundlegenden Konzepten
    ausgewählt, etwa acht aus der Neurowissenschaft, drei aus der Psychologie und drei aus dem
    maschinellen Lernen. So bleibt der Kurs in der Neurowissenschaft verankert und hebt zugleich die
    Ideen hervor, die sie am tiefgreifendsten verändert haben. Die Auswahl wird jedes Jahr neu ausgelost
    und sorgt so für intellektuelle Vielfalt, Erneuerung und Entdeckergeist. Jede Vorlesung stellt eine
    zentrale Idee zusammen mit den Schlüsselarbeiten vor, die ihren Ursprung, ihre Wirkung und ihren
    Einfluss über Disziplinen hinweg bestimmt haben. In ausgewählten Sitzungen präsentieren Studierende
    grundlegende Paper, was kritische Auseinandersetzung und aktive Beteiligung fördert. Am Ende des
    Kurses haben die Studierenden einen breiten, zusammenhängenden Überblick über grundlegende Ideen
    gewonnen, verstehen, wie diese sich gegenseitig beeinflusst haben, und haben eine klare Vorstellung
    davon, wie Neurowissenschaft, Psychologie und maschinelles Lernen gemeinsam das heutige Denken
    geprägt haben. Wer für den Kurs eine Note erhalten möchte, wird auf Grundlage aktiver Teilnahme und
    einer gründlichen kritischen Bewertung eines Forschungsartikels bewertet.

- id: seminar
  title: "Seminar: Neuroscience and Machine Learning"
  when: "Summer & winter term · selective, max. five students · Fridays, 14:15–15:30"
  when_de: "Sommer- & Wintersemester · mit Auswahlverfahren, max. fünf Studierende · freitags, 14:15–15:30 Uhr"
  teaser: >-
    This **seminar is designed for highly motivated students** who are considering joining our lab for a
    master's thesis or a related research project.
  teaser_de: >-
    Dieses **Seminar richtet sich an besonders motivierte Studierende**, die überlegen, für eine
    Masterarbeit oder ein vergleichbares Forschungsprojekt zu uns ins Labor zu kommen.
  details: >-
    The small group creates an intensive, interactive setting with close mentorship. Admission is based
    on a short letter of motivation and overall fit with the lab's research focus. The seminar features
    in-depth presentations by postdoctoral researchers, PhD students, and external collaborators,
    offering students first-hand insight into cutting-edge research in the lab. Participants are
    expected to engage actively in discussions and, at an appropriate stage, to present either a seminal
    paper or their own research idea or proposal. Students interested in participating should submit a
    brief letter of motivation and CV via [email](mailto:dr.thomas.wolfers@gmail.com).
  details_de: >-
    Die kleine Gruppe ermöglicht ein intensives, interaktives Format mit enger Betreuung. Die Aufnahme
    erfolgt auf Grundlage eines kurzen Motivationsschreibens und der Passung zum Forschungsschwerpunkt
    des Labors. Im Seminar stellen Postdocs, Promovierende und externe Kooperationspartner ihre Arbeit
    ausführlich vor und geben so aus erster Hand Einblick in die aktuelle Forschung des Labors. Von den
    Teilnehmenden wird erwartet, dass sie sich aktiv an den Diskussionen beteiligen und zu gegebener
    Zeit entweder ein grundlegendes Paper oder eine eigene Forschungsidee bzw. einen eigenen
    Projektvorschlag vorstellen. Interessierte senden bitte ein kurzes Motivationsschreiben und einen
    Lebenslauf per [E-Mail](mailto:dr.thomas.wolfers@gmail.com).
