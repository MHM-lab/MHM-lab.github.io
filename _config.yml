# ---------------------------------------------------------------
# Site settings. After changing this file, GitHub rebuilds the site
# automatically (takes ~1 minute).
# ---------------------------------------------------------------

title: Mental Health Mapping
description: >-
  The laboratory for Mental Health Mapping at Friedrich Schiller University Jena uses large,
  diverse datasets and machine learning to map mental health and illness, and to
  bring this work into clinical practice.
url: https://mhm-lab.github.io

# Top menu (in this order)
nav:
  - title: People
    url: /people/
  - title: Research
    url: /research/
  - title: Publications
    url: /selected/
  - title: Teaching
    url: /teaching/
  - title: Community
    url: /community/
  - title: Values
    url: /values/
  - title: Join Us
    url: /join_us/

# Links shown in the footer of every page
social:
  - title: LinkedIn
    url: https://www.linkedin.com/in/thomas-wolfers-5b96694b/
  - title: Bluesky
    url: https://bsky.app/profile/thomaswolfers.bsky.social
  - title: Google Scholar
    url: https://scholar.google.com/citations?user=4f2rdMcAAAAJ&hl=en
  - title: GitHub
    url: https://github.com/MHM-lab

# Every page uses the single layout in _layouts/default.html
defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false

exclude:
  - README.md
